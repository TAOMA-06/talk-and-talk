services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/talk-and-talk.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: ../backend/api
    env_file:
      - ${DEPLOY_ENV_FILE:-../backend/api/.env.production}
    environment:
      # Default false so missing host SEED_ON_STARTUP cannot override .env.production.
      # Staging: export SEED_ON_STARTUP=true or set in .env.staging.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379}
    # Production WeChat merchant private key (do not commit the PEM).
    volumes:
      - ${WECHAT_PAY_PRIVATE_KEY_HOST_PATH:?WECHAT_PAY_PRIVATE_KEY_HOST_PATH must be set}:/run/secrets/wechat_private_key.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/node/.cache:size=32m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talk_and_talk
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d talk_and_talk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
