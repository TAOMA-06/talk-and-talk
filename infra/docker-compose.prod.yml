services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/talk-and-talk.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    env_file:
      - ${DEPLOY_ENV_FILE:-./services/api/.env.production}
    environment:
      # Default false so missing host SEED_ON_STARTUP cannot override .env.production.
      # Staging: export SEED_ON_STARTUP=true or set in .env.staging.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379}
    # Production WeChat: mount merchant private key (do not commit the PEM).
    # volumes:
    #   - ${WECHAT_PAY_PRIVATE_KEY_HOST_PATH:-./secrets/wechat_private_key.pem}:/run/secrets/wechat_private_key.pem:ro
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talk_and_talk
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d talk_and_talk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
