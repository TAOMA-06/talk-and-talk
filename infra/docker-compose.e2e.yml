services:
  postgres:
    image: ${E2E_POSTGRES_IMAGE:?E2E_POSTGRES_IMAGE must be an approved immutable digest}
    pull_policy: never
    environment:
      POSTGRES_DB: ${E2E_POSTGRES_DATABASE:?E2E_POSTGRES_DATABASE must be set}
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: talk
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:?E2E_POSTGRES_PORT must be set}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: ${E2E_REDIS_IMAGE:?E2E_REDIS_IMAGE must be an approved immutable digest}
    pull_policy: never
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:?E2E_REDIS_PORT must be set}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
