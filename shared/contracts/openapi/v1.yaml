    post:
      tags: [admin, commercial, favorites]
      summary: Record an audited human resolution for one retained terminal delivery attempt without resending
      description: Operations and admin only. The resolution code must exactly match the retained failedBeforeSend, rejected, or uncertain provider state. This operation only records an operational reconciliation and always returns automaticResend false; uncertain outcomes must be reconciled against provider evidence and are never retried here.
      operationId: adminResolveAvailabilityReminderTerminalAttempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityReminderTerminalResolutionInput"
      responses:
        "200":
          description: The retained terminal attempt was idempotently or newly reconciled; no automatic resend occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityReminderTerminalResolutionEnvelope"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
