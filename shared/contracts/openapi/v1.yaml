openapi: 3.0.3
info:
  title: Talk&Talk API
  version: 0.1.0
  description: |
    Frozen public contract for `/api/v1`.
    All JSON responses use a uniform envelope (see components.schemas.SuccessEnvelope / ErrorEnvelope).
    Breaking changes require `/api/v2` or coordinated release notes.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-staging.talkandtalk.app/api/v1
    description: Staging
  - url: https://api.talkandtalk.app/api/v1
    description: Production
tags:
  - name: health
  - name: metrics
  - name: auth
  - name: users
  - name: companions
  - name: orders
  - name: payments
  - name: conversations
  - name: moderation
  - name: notifications
  - name: legal
  - name: support
  - name: commercial
  - name: community
  - name: reviews
  - name: favorites
  - name: recently-viewed
  - name: admin
paths:
  /legal/terms:
    get:
      tags: [legal]
      summary: Current immutable terms snapshot
      operationId: getCurrentTerms
      security: []
      responses:
        "200":
          description: HTML terms document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/privacy:
    get:
      tags: [legal]
      summary: Current immutable privacy-policy snapshot
      operationId: getCurrentPrivacyPolicy
      security: []
      responses:
        "200":
          description: HTML privacy-policy document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/platform-rules:
    get:
      tags: [legal]
      summary: Current immutable platform-rules snapshot
      operationId: getCurrentPlatformRules
      security: []
      responses:
        "200":
          description: HTML platform-rules document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/{document}/versions/{version}:
    get:
      tags: [legal]
      summary: Retrieve a previously published immutable legal-document version
      operationId: getLegalDocumentVersion
      security: []
      parameters:
        - name: document
          in: path
          required: true
          schema: { type: string, enum: [terms, privacy, platform-rules] }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Archived HTML legal document
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Health snapshot (ok | degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics text
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format (text/plain)
  /auth/sms/send-code:
    post:
      tags: [auth]
      summary: Send SMS verification code
      operationId: sendSmsCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "13800138000"
      responses:
        "200":
          description: Code sent (mock logs code in development/staging)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresInSeconds:
                            type: integer
        "429":
          $ref: "#/components/responses/Error"
  /auth/phone/login:
    post:
      tags: [auth]
      summary: Phone + code login
      operationId: phoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/apple:
    post:
      tags: [auth]
      summary: Apple Sign-In
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
  /auth/wechat/mini-program:
    post:
      tags: [auth]
      summary: Sign in with WeChat Mini Program code
      operationId: wechatMiniProgramLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Short-lived credential returned by wx.login
      responses:
        "200":
          description: Token pair + new or existing WeChat user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/wechat/mini-program/status:
    get:
      tags: [auth]
      summary: Check whether server-side Mini Program credentials are configured
      operationId: wechatMiniProgramStatus
      security: []
      responses:
        "200":
          description: Configuration readiness without credential values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, configured]
                        properties:
                          module: { type: string, enum: [wechatMiniProgram] }
                          status: { type: string, enum: [configured, unconfigured] }
                          configured: { type: boolean }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access/refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me:
    get:
      tags: [users]
      summary: Current user (legacy path)
      operationId: getUsersMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me/legal-consents:
    get:
      tags: [users]
      summary: Read the caller's latest legal-consent receipt
      operationId: getLegalConsent
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: version
          schema: { type: string }
      responses:
        "200":
          description: Latest receipt and whether it matches the current published documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [users]
      summary: Record consent to the current privacy policy and terms
      operationId: recordLegalConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - privacyAccepted
                - termsAccepted
                - adultConfirmed
                - acceptedAt
                - privacyUrl
                - termsUrl
                - source
              properties:
                version: { type: string }
                privacyAccepted: { type: boolean, enum: [true] }
                termsAccepted: { type: boolean, enum: [true] }
                adultConfirmed: { type: boolean, enum: [true] }
                acceptedAt: { type: string, format: date-time }
                privacyUrl: { type: string, format: uri }
                termsUrl: { type: string, format: uri }
                source: { type: string, enum: [wechatMiniProgram, web] }
      responses:
        "201":
          description: Consent receipt recorded or existing current receipt returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
  /users/me/legal-consents/current:
    delete:
      tags: [users]
      summary: Withdraw the caller's current legal consent
      operationId: withdrawLegalConsent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Withdrawal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me:
    get:
      tags: [users]
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [users]
      summary: Update profile (displayName, gender, etc.)
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
                gender: { type: string, enum: [female, male] }
                age: { type: integer, minimum: 18, maximum: 120 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Display name failed public-profile moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/deletion-request:
    post:
      tags: [users]
      summary: Request account deletion
      operationId: requestDeletion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions/status:
    get:
      tags: [companions]
      summary: Companions module status
      operationId: companionsStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions:
    get:
      tags: [companions]
      summary: List companions
      description: The default public catalog keeps its existing order. keyword is an explicitly submitted, short public-catalog query matched only against a companion's public name, role, service tags, and titles of current active service offerings; it is not persisted or used as a recommendation, marketing, companion-visible, or availability signal. sortBy is an explicit customer choice that switches the client to this public catalog rather than a personalized recommendation. soonestAvailable only considers current public profiles with a current structured candidate that has remaining capacity, then orders by the earliest candidate for the same matching active service in the next seven days, or inside availableWithinDays when that shorter window is selected. It does not reserve a time, expose a promise of availability, or use legacy free-text availability; detail and order creation recheck capacity. When keyword is matched through a service title together with topicId, deliveryMode, maxServicePriceCents, or availableWithinDays, those conditions must match the same current active service offering. availableWithinDays additionally requires a current structured availability candidate with remaining capacity for that same matching service; legacy free-text availability never qualifies. maxServicePriceCents is the total price for that one current service, not a historical order price or a duration-normalized estimate. Private preferences, chat, order body, bookmarks, recent views, companion-visible relationships, and marketing data are never inputs to this endpoint.
      operationId: listCompanions
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: keyword
          description: Explicit public-catalog keyword, normalized to a nonblank 1–40-character string. Matches public name, role, service tag, or a current active service title only.
          schema: { type: string, minLength: 1, maxLength: 40 }
        - in: query
          name: sortBy
          description: Explicit public ordering — online first, higher rating, more public reviews, lower public per-30-minute profile price, or earliest current structured capacity. soonestAvailable considers the next seven days unless availableWithinDays selects a shorter window; it does not reserve a time and capacity is rechecked later.
          schema: { type: string, enum: [online, rating, reviewCount, priceAsc, soonestAvailable] }
        - in: query
          name: availability
          schema: { type: string }
        - in: query
          name: isOnline
          schema: { type: boolean }
        - in: query
          name: topicId
          description: Match an active public service offering tagged with this stable platform topic id.
          schema: { type: string, enum: [t1, t2, t3, t4, t5, t6] }
        - in: query
          name: deliveryMode
          description: Match an active public service offering by delivery method.
          schema: { type: string, enum: [text, voice] }
        - in: query
          name: maxServicePriceCents
          description: Match an active public service offering whose current one-time total price is at or below this CNY-cent amount.
          schema: { type: integer, minimum: 100, maximum: 2000000 }
        - in: query
          name: availableWithinDays
          description: Limit results to matching active services with a currently free structured candidate starting in the next 1–7 days. Capacity is recomputed on this request; the detail page and order creation recheck it again.
          schema: { type: integer, minimum: 1, maximum: 7 }
      responses:
        "200":
          description: Companion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /favorites/companions:
    get:
      tags: [favorites]
      summary: List the current customer's private companion bookmarks
      description: Customer-only private bookmarks. The response reapplies the current public-profile eligibility gate, so unpublished, unverified, suspended, or otherwise ineligible profiles are omitted. Each item contains only the caller's private availability-reminder preference and a fixed minimum interval; it never exposes a subscription grant. This endpoint never creates a follower graph, a companion-visible count, or notifications.
      operationId: listFavoriteCompanions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current public companions saved by this customer, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/FavoriteCompanion"
        "403":
          $ref: "#/components/responses/Error"
  /favorites/companions/{id}/availability-reminder:
    put:
      tags: [favorites]
      summary: Arm or disarm the current customer's private availability-reminder preference
      description: >-
        Customer-only. The target must still be this caller's currently public bookmark on every write.
        Enabling requires an unconsumed, caller-owned one-time `availabilityReminder` subscription grant
        obtained after an explicit Mini Program prompt; disabling requires no grant. A grant already held by a
        private availability-reminder reservation cannot be rebound here. This endpoint only records the private
        preference and its one-time grant binding: it does not scan availability, create a schedule, queue a
        notification, send a message, or notify the companion. Internal candidate preflight, its later handoff,
        any explicitly enabled bounded preparation or delivery run, any ephemeral post-handoff recheck, private
        authorization reservation, private consumed-grant send lease, aggregate-only operational metric, or private
        provider outcome are invisible to this endpoint and return neither a decision, handoff, aggregate, readiness
        result, reservation, lease, delivery result, nor recipient. Any later delivery must separately recheck current
        public eligibility, real availability, the exact bound unconsumed grant, and the returned minimum interval
        before it can atomically consume that grant; only a separately confirmed provider acceptance counts as sent.
      operationId: setFavoriteAvailabilityReminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                subscriptionGrantId:
                  type: string
                  format: uuid
                  description: Required when `enabled` is true; it must be a current caller-owned `availabilityReminder` grant. Never returned by this endpoint.
      responses:
        "200":
          description: Private preference saved; no notification was queued or sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FavoriteAvailabilityReminderPreference"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /favorites/companions/{id}:
    put:
      tags: [favorites]
      summary: Save one currently public companion as a private bookmark
      description: Customer-only and idempotent. A profile that is no longer publicly eligible is returned as not found rather than revealing its private status.
      operationId: saveFavoriteCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private bookmark saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [favorited, companion]
                        properties:
                          favorited: { type: boolean, enum: [true] }
                          companion:
                            $ref: "#/components/schemas/PublicCompanion"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [favorites]
      summary: Remove one private companion bookmark
      description: Customer-only and idempotent. Removing a bookmark never affects a companion profile, ranking, orders, settlement, or notifications.
      operationId: removeFavoriteCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private bookmark removal result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [favorited, removed]
                        properties:
                          favorited: { type: boolean, enum: [false] }
                          removed: { type: boolean }
        "403":
          $ref: "#/components/responses/Error"
  /recently-viewed/companions:
    get:
      tags: [recently-viewed]
      summary: List the current customer's private companion recall list
      description: Customer-only recent views, newest first, capped at twenty retained records. The response reapplies the current public-profile eligibility gate, so unpublished, unverified, suspended, or otherwise ineligible profiles are omitted. It never feeds recommendations, notifications, a companion-visible profile, orders, refunds, settlement, or marketing, and an old view is never a promise that a current service slot is available.
      operationId: listRecentlyViewedCompanions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current public companions recently opened by this customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 20
                            items:
                              $ref: "#/components/schemas/PublicCompanion"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      tags: [recently-viewed]
      summary: Clear the current customer's private companion recall list
      description: Customer-only. Deletes only the caller's recent-view records and does not affect bookmarks, profiles, recommendations, orders, refunds, settlement, or notifications.
      operationId: clearRecentlyViewedCompanions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Private recent-view records cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cleared]
                        properties:
                          cleared: { type: integer, minimum: 0 }
        "403":
          $ref: "#/components/responses/Error"
  /recently-viewed/companions/{id}:
    put:
      tags: [recently-viewed]
      summary: Record the current customer's opening of one public companion profile
      description: Customer-only and idempotent. Reopening refreshes the private recency timestamp and the server removes older records beyond twenty. A profile that is no longer publicly eligible is returned as not found rather than revealing its private status.
      operationId: recordRecentlyViewedCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private recall record refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [recorded]
                        properties:
                          recorded: { type: boolean, enum: [true] }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /companions/me/profile:
    get:
      tags: [companions]
      summary: Get the current user's companion profile
      operationId: getOwnCompanionProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [companions]
      summary: Update availability or moderated public companion profile content
      operationId: updateOwnCompanionProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, minLength: 1, maxLength: 500 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                availability: { type: string, enum: [online, available, busy] }
      responses:
        "200":
          description: Updated companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Public profile content failed moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/application:
    post:
      tags: [companions]
      summary: Submit an unpublished companion application for staff review
      operationId: applyForCompanion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, bio, pricePerHalfHour, tags, availableTimes, languages, specialties, cityDistrict]
              properties:
                role: { type: string, minLength: 1, maxLength: 80 }
                bio: { type: string, minLength: 1, maxLength: 500 }
                pricePerHalfHour: { type: integer, minimum: 1, maximum: 10000 }
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 40 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                languages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, maxLength: 40 }
                specialties:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 60 }
                topicIds:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 80 }
                cityDistrict: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Unpublished companion application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Application public content failed moderation and was not submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the application was not submitted
          content:
            application/json:
