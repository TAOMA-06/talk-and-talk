          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Community media is fail-closed until the approved media review pipeline is enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Generic temporary community-write throttle; no quota, reset time, or activity data is exposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /community/posts/{id}/like:
    post:
      tags: [community]
      summary: Set current user's like state
      operationId: setCommunityPostLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "201":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /community/posts/{id}/report:
    post:
      tags: [community]
      summary: Submit one private report receipt for the current user's visible community post
      description: >-
        Accepts only a short reporter reason and the post already visible to that reporter. It creates an
        auditable intake signal, not an automatic penalty, staff decision, customer-service conclusion, or
        emergency-response promise. Repeating the same reporter/post pair returns the existing receipt. Different
        reporters may be internally grouped under one still-open staff case, but the response never exposes another
        reporter, a report count, or an internal moderation case.
      operationId: reportCommunityPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 2
                  maxLength: 500
                  description: Brief reason only; do not paste phone, email, identity-document, chat, or order data.
      responses:
        "201":
          description: Private report receipt; duplicate indicates a previous submission by this same user for this post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          description: Generic temporary community-write throttle; repeated reports for the same post remain idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/companion/{id}:
    get:
      tags: [reviews]
      summary: List companion reviews
      operationId: listCompanionReviews
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Reviews for the companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
  /reviews/orders/{orderId}/me:
    get:
      tags: [reviews]
      summary: Read the authenticated customer's review for an owned order
      description: Returns the caller's public-safe review fields or an authoritative null after verifying order ownership. Missing and non-owned orders share the same 404 response; no other customer's review, moderation data, or internal fields are exposed.
      operationId: getOwnOrderReview
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The caller's review for this order, or null when no review exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnOrderReviewEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: The order does not exist or is not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews:
    post:
      tags: [reviews]
      summary: Review a completed order
      operationId: createReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, rating, content]
              properties:
                orderId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Review content failed moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the review was not created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/refund:
    post:
      tags: [orders]
      summary: Create refund skeleton
      operationId: refundOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Refund transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/status:
    get:
      tags: [payments]
      summary: Payments module status
      operationId: paymentsStatus
      responses:
        "200":
          description: Active payment provider and production readiness
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, provider, productionReady]
                        properties:
                          module: { type: string, enum: [payments] }
                          status: { type: string, enum: [active, unavailable] }
                          provider: { type: string, enum: [real, mock, disabled] }
                          productionReady: { type: boolean }
  /payments/wechat/notify:
    post:
      tags: [payments]
      summary: WeChat Pay notify callback
      operationId: wechatNotify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Notify accepted
  /payments/wechat/complaint-notify:
    post:
      tags: [payments, support]
      summary: Receive a signed WeChat Pay Consumer Complaint 2.0 notification
      description: Verifies the WeChat Pay signature, decrypts the AES-256-GCM resource, persists only compact notification metadata, and acknowledges after the durable handoff. The encrypted or plaintext callback body is never retained.
      operationId: wechatPaymentComplaintNotify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Notification durably accepted; provider detail reconciliation continues asynchronously
        "401":
          $ref: "#/components/responses/Error"
  /payments/disputes/me:
    get:
      tags: [payments, support]
      summary: List the authenticated customer's order-linked payment dispute statuses
      description: Returns only the caller's own linked status and SLA timestamps. Complaint text, provider references, staff assignment, internal notes, and evidence metadata are omitted.
      operationId: listMyPaymentDisputes
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentDisputeStatus"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Customer-safe payment dispute status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDisputeListEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /payments/disputes/by-order/{orderId}:
    get:
      tags: [payments, support]
      summary: Read the caller-visible payment dispute linked to one participating order
      description: Customer and current companion participants may read only the sanitized provider status and SLA facts. Provider references, complaint text, staff assignment, internal notes, and evidence metadata are omitted. A participating order with no linked dispute returns a null item.
      operationId: getMyPaymentDisputeByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Caller-safe payment dispute, or null when none is linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullablePaymentDisputeEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /payments/disputes/{id}:
    get:
      tags: [payments, support]
      summary: Read one caller-visible payment dispute by its platform identifier
      description: Access is limited to the customer or current companion participant of the linked order and returns the same sanitized projection as the personal list.
      operationId: getMyPaymentDispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Caller-safe payment dispute detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDisputeEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /payments/wechat/mock-notify:
    post:
      tags: [payments]
      summary: Simulate successful payment only when the mock provider is active
      operationId: wechatMockNotify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outTradeNo]
              properties:
                outTradeNo: { type: string }
      responses:
        "201":
          description: Mock notify applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/review-queue:
    get:
      tags: [payments]
      summary: List refunds awaiting administrator action
      operationId: listRefundReviewQueue
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/PageSizeQuery"
        - in: query
          name: status
          description: Filter within the actionable queue; terminal refunds are never returned.
          schema: { type: string, enum: [pendingReview, pending, processing, failed] }
      responses:
        "200":
          description: Pending-review, failed, stale, and SLA-overdue refunds with current assignee, review deadline, resolution deadline, and overdue stage (finance or administrator)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundReviewQueueEnvelope"
  /payments/refunds/{id}/claim:
    post:
      tags: [payments]
      summary: Claim an active refund using a single-owner transaction lock
      description: A finance operator or administrator must become the durable current owner before approving, rejecting, or retrying a refund. Concurrent claims by another operator fail closed.
      operationId: claimRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Refund claimed, including public-safe SLA facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: Refund is terminal or already assigned to another operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /payments/refunds/{id}/approve:
    post:
      tags: [payments]
      summary: Approve an assigned pending refund (current finance/admin owner only)
      operationId: approveRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Refund approved and submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/reject:
    post:
      tags: [payments]
      summary: Reject an assigned pending refund (current finance/admin owner only)
      operationId: rejectRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Refund rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/retry:
    post:
      tags: [payments]
      summary: Retry an assigned failed refund with its original refund reference (current finance/admin owner only)
      operationId: retryRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Refund retry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/sync:
    post:
      tags: [payments]
      summary: Query WeChat for a submitted refund's authoritative state (administrator only)
      operationId: syncRefundForAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Refund state reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: Refund has not been submitted or was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /conversations/status:
    get:
      tags: [conversations]
      summary: Conversations module status
      operationId: conversationsStatus
      responses:
        "200":
          description: Status including whether media messaging is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /conversations/{id}/status:
    get:
      tags: [conversations]
      summary: Viewer-specific chat delivery status
      operationId: conversationDeliveryStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Viewer-owned media/reminder and future-booking settings, bounded order-chat availability, readable-history status, and any active chat-only restriction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [mediaEnabled, messageNotificationsMuted, conversationBlockedByYou, viewerCanManageFutureBookingBoundary, futureBookingsDeclinedByYou, futureBookingBoundaryScope, existingOrdersUnaffected, conversationUnaffected, messageHistoryAvailable, messageInteractionAvailable, chatRestriction]
                        properties:
                          mediaEnabled: { type: boolean }
                          messageNotificationsMuted:
                            type: boolean
                            description: True only when the authenticated participant muted future message reminders for this conversation. It never reflects the other participant's preference.
                          conversationBlockedByYou:
                            type: boolean
                            description: True only when the authenticated participant set an active block for this conversation. It never identifies another participant's choice.
                          viewerCanManageFutureBookingBoundary:
                            type: boolean
                            description: True only for the companion account that owns this conversation's marketplace profile.
                          futureBookingsDeclinedByYou:
                            type: boolean
                            description: Viewer-owned only. Customers always receive false and cannot infer whether the companion privately declined future marketplace activity.
                          futureBookingBoundaryScope:
                            type: string
                            enum: [newOrdersAndRecommendationsOnly]
                          existingOrdersUnaffected:
                            type: boolean
                            enum: [true]
                          conversationUnaffected:
                            type: boolean
                            enum: [true]
                          messageHistoryAvailable:
                            type: boolean
                            description: False only when an active privacy boundary hides ordinary chat history. A completed order remains readable even when ordinary sending is closed.
                          messageInteractionAvailable:
                            type: boolean
                            description: True only during an eligible paid order's bounded communication window and when no active privacy boundary exists.
                          chatRestriction:
                            nullable: true
                            $ref: "#/components/schemas/ChatRestriction"
  /conversations/{id}/notification-preference:
    put:
      tags: [conversations]
      summary: Set the authenticated participant's future message-reminder mute for one conversation
      operationId: setConversationNotificationPreference
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted:
                  type: boolean
                  description: When true, suppress only this participant's future ordinary message notifications. It does not block messages or alter orders, reports, moderation, support, or safety notifications.
      responses:
        "200":
          description: The authenticated participant's updated preference
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [messageNotificationsMuted]
                        properties:
                          messageNotificationsMuted: { type: boolean }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /conversations/{id}/block:
    put:
      tags: [conversations]
      summary: Set or remove the authenticated participant's active-only message boundary for one conversation
      description: >-
        Blocking stops ordinary message sending and display for both participants and removes the blocker's pending
        message reminders. It does not cancel an order, decide a refund or settlement, create a report, or close
        support or safety work. The response never identifies whether another participant also set a boundary.
      operationId: setConversationBlock
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked:
                  type: boolean
                  description: True creates or preserves the caller's active boundary; false removes only the caller's boundary.
      responses:
        "200":
          description: The caller's block state, readable-history state, and bounded message availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [conversationBlockedByYou, messageHistoryAvailable, messageInteractionAvailable]
                        properties:
                          conversationBlockedByYou: { type: boolean }
                          messageHistoryAvailable: { type: boolean }
                          messageInteractionAvailable: { type: boolean }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /conversations/{id}/future-booking-boundary:
    put:
      tags: [conversations, recommendations, orders]
      summary: Privately decline or restore future marketplace activity with this customer
      description: >-
        Companion-only, reason-free relationship setting. Declining removes this companion from the customer's future
        recommendations and rejects only new order creation with the generic companion-unavailable error. It never
        changes existing orders, chat history or delivery, refunds, reviews, support, reports, moderation, or either
        account's standing. The customer is never notified and no response available to the customer reveals the choice.
      operationId: setConversationFutureBookingBoundary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [declined]
              properties:
                declined:
                  type: boolean
                  description: True creates or preserves the private future-only boundary; false removes it.
      responses:
        "200":
          description: Companion-owned boundary state; contains no reason, customer-facing flag, or historical choice log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [viewerCanManageFutureBookingBoundary, futureBookingsDeclinedByYou, futureBookingBoundaryScope, existingOrdersUnaffected, conversationUnaffected, changed]
                        properties:
                          viewerCanManageFutureBookingBoundary: { type: boolean, enum: [true] }
                          futureBookingsDeclinedByYou: { type: boolean }
                          futureBookingBoundaryScope: { type: string, enum: [newOrdersAndRecommendationsOnly] }
                          existingOrdersUnaffected: { type: boolean, enum: [true] }
                          conversationUnaffected: { type: boolean, enum: [true] }
                          changed: { type: boolean }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /conversations:
    get:
      tags: [conversations]
      summary: List user conversations
      operationId: listConversations
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: blockedByYou, in: query, required: false, schema: { type: boolean, default: false }, description: When true, returns only conversations actively blocked by the authenticated caller. }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [conversations, pagination]
                        properties:
                          conversations:
                            type: array
                            items:
                              $ref: "#/components/schemas/ConversationSummary"
                          pagination:
                            $ref: "#/components/schemas/BoundedPagination"
  /conversations/summary:
    get:
      tags: [conversations, support]
      summary: Get authoritative conversation-home aggregates for the authenticated user
      operationId: getConversationSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active support work count; clients must display unknown when this endpoint fails
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [activeSupportCount]
                        properties:
                          activeSupportCount: { type: integer, minimum: 0 }
  /conversations/{id}/messages:
    get:
      tags: [conversations]
      summary: List messages
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Messages page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
    post:
      tags: [conversations]
      summary: Send message (moderation pipeline)
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 2000 }
                attachmentIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string }
              anyOf:
                - required: [content]
                - required: [attachmentIds]
      responses:
        "201":
          description: Message + moderation decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "403":
          description: >
            Public interaction identity hard gate or conversation interaction
            boundary rejected the caller. Identity rejects use
            `PUBLIC_INTERACTION_IDENTITY_REQUIRED` with recoveryPath and do not
            write messages, moderation cases, notifications, or order changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /conversations/{id}/media-uploads:
    post:
      tags: [conversations]
      summary: Reserve a short-lived direct media upload
      operationId: reserveConversationMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mimeType, sizeBytes, sha256]
              properties:
                kind: { type: string, enum: [image, audio] }
                mimeType: { type: string }
                sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
                sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
                durationMs: { type: integer, minimum: 1, maximum: 60000 }
      responses:
        "201":
          description: Upload instruction with an opaque storage credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "503":
          $ref: "#/components/responses/Error"
  /conversations/{id}/media-uploads/{assetId}/complete:
    post:
      tags: [conversations]
      summary: Verify a direct media upload before it may be attached
      operationId: completeConversationMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Uploaded asset ready to attach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /case-evidence/uploads/{assetId}/complete:
    post:
      tags: [support, commercial]
      summary: Verify a controlled upload and enqueue standalone safety moderation
      description: Idempotent for the authenticated uploader; no business record can consume the asset until status is approved.
      operationId: completeControlledCaseEvidenceUpload
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Upload verified and moderation queued, or the existing terminal status on a safe retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlledCaseEvidenceStatusEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /case-evidence/uploads/{assetId}:
    get:
      tags: [support, commercial]
      summary: Poll the authenticated uploader's controlled evidence status
      operationId: getControlledCaseEvidenceUploadStatus
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Metadata and moderation state only; no storage or read URL is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlledCaseEvidenceStatusEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
  /case-evidence/attachments/{attachmentId}/read-url:
    get:
      tags: [support, commercial]
      summary: Issue an authorized read URL for one approved bound evidence attachment
      description: >-
        Returns 404 for unauthorized viewers. Support facts are visible only to their requester and the assigned support/admin
        boundary; attendance attachments to both case participants and assigned support/admin; companion incidents to the owner
        and supply/admin. Blocked, pending, failed, expired and unbound assets never receive a URL.
      operationId: createControlledCaseEvidenceReadUrl
      security:
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Short-lived provider-authorized read URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlledCaseEvidenceReadUrlEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /moderation/status:
    get:
      tags: [moderation]
      summary: Moderation module status
      operationId: moderationStatus
      responses:
        "200":
          description: Status proving that external user-content transmission is disabled and sensitive content stays on local rules and authorized human review
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [module, status, aiConfigured, externalProvider, externalUserContentTransmission, sensitiveContentProcessing]
                    properties:
                      module: { type: string, enum: [moderation] }
                      status: { type: string, enum: [active] }
                      aiConfigured: { type: boolean, enum: [false] }
                      externalProvider: { nullable: true, enum: [null] }
                      externalUserContentTransmission: { type: boolean, enum: [false] }
                      sensitiveContentProcessing: { type: string, enum: [local-rules-and-human-review] }
  /moderation/check:
    post:
      tags: [moderation]
      summary: Standalone text moderation
      operationId: moderationCheck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                source: { type: string }
                conversationId: { type: string }
      responses:
        "201":
          description: Moderation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
