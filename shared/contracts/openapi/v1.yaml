        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDisputeCompletionInput"
      responses:
        "200":
          description: Complaint completion accepted or the idempotent prior result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
