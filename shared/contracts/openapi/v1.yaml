      tags: [moderation]
      summary: List the current user's report receipts and public outcomes
      description: >-
        Returns only reporter-safe status, deadline, resolution, a follow-up count,
        and a bounded submittedSummary derived from the reporter's own reason line.
        Follow-up statements are loaded only from the owner-scoped case detail endpoint,
        so the paginated list never nests an unbounded evidence history.
        The reported account, evidence from other parties, model output, reviewer identity and
        raw conversation context, internal policy reasoning are never exposed.
      operationId: listMyModerationReports
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Reporter-safe case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
  /moderation/reports/{id}:
    get:
      tags: [moderation]
      summary: Get one current-user report receipt and public outcome
      description: Includes the same bounded reporter-owned submittedSummary as the list plus owner-scoped follow-ups; raw conversation context and other-party evidence remain hidden.
      operationId: getMyModerationReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reporter-safe case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /moderation/reports/{id}/follow-ups:
    post:
      tags: [moderation]
      summary: Add private follow-up information to an open current-user report
      description: >-
        The statement is visible only to authorized review operations, does not alter the
        disposition automatically, and cannot be added after the report is closed. At most five
        follow-up statements may be added to one report.
      operationId: addMyModerationReportFollowUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
