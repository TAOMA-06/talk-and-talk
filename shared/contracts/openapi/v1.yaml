              type: object
              required: [statement]
              properties:
                statement: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "201":
          description: Follow-up evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /moderation/appeals:
    post:
      tags: [moderation]
      summary: Submit the single allowed appeal for blocked content or a chat restriction
      description: >-
        The appeal must be submitted within the case's published 30-day window. A successful
        submission reopens the case in the independent review queue, returns the 72-hour review
        deadline and policy version, and prevents the reviewer responsible for the original manual
        decision from claiming, receiving or deciding the appeal.
      operationId: createModerationAppeal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, reason]
              properties:
                caseId: { type: string }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Appeal receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          $ref: "#/components/responses/Error"
  /moderation/appeals/me:
    get:
      tags: [moderation]
      summary: List the current user's content-moderation appeals
      description: >-
        Returns only the current user's appeal reason, public status, submission window, review
        deadline, overdue indicator, policy version and public resolution. Reviewer identities,
        evidence from other parties and internal decision reasoning are not exposed.
      operationId: listMyModerationAppeals
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: query
          description: Exact owner-scoped moderation case ID used by notification cold-start recovery
          schema: { type: string, maxLength: 191 }
        - name: appealId
          in: query
          description: Exact owner-scoped moderation appeal ID used by notification cold-start recovery
          schema: { type: string, maxLength: 191 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, upheld, overturned, dismissed] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current-user appeal status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
  /moderation/appeals/eligible:
    get:
      tags: [moderation]
      summary: List current-user moderation actions still eligible for appeal
      description: >-
        Returns a privacy-limited list of the current user's own content actions or chat
        restrictions that have no prior appeal and remain inside the published submission window.
        It exposes no reviewer identity, internal evidence, model reasoning or other user's data.
      operationId: listMyAppealableModerationCases
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: query
          description: Exact owner-scoped case ID used by notification cold-start recovery
