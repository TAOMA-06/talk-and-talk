      required: [status, sourceType, sourceReference, evidenceReference, evidenceDigest, anonymizedAt]
      properties:
        status:
          type: string
          enum: [available, legacyUnavailable, anonymized]
          description: available exposes controlled references only; legacyUnavailable means the action predates this evidence contract; anonymized is an irreversible retention tombstone.
        sourceType:
          type: string
          nullable: true
          enum: [moderationCase, supportTicket, paymentDispute, attendanceDispute, conversationSafety, manualSafetyReview, legalCompliance]
