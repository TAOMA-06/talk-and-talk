      operationId: createReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                conversationId: { type: string }
                messageId: { type: string, description: Specific visible message being reported }
                recentContext: { type: string, deprecated: true, description: Ignored; evidence is derived server-side }
      responses:
        "201":
          description: Report case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /moderation/reports/me:
