  /support/tickets/{id}/order-facts:
    post:
      tags: [support]
      summary: Add one short private fact to the current requester's open order issue or refund ticket
      description: >-
        The ticket must belong to the current user and the user must still be a participant in its linked order.
        Facts are not shared with the other order participant, do not copy chat content, and do not automatically alter
        refunds, settlement, or order status. Up to three asset ids may reference uploads reserved through the scoped
        evidence endpoint; each must belong to the requester, pass provider verification and moderation, remain unexpired,
        and be unused. Arbitrary URLs, opaque user references and binary request bodies are rejected. Obvious identity,
        contact, document, and health material is rejected from the text before storage. A ticket accepts at most 10 facts.
      operationId: addOrderSupportFact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement:
                  type: string
                  minLength: 5
                  maxLength: 1200
                  description: A voluntary first-hand time, fulfillment, or payment fact.
                evidenceAssetIds:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Fact added to the private support record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /support/tickets/{id}/evidence-uploads:
