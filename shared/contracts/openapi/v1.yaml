  /admin/data-retention/legal-hold-actions/{actionId}/approvals:
    post:
      tags: [admin]
      summary: Independently approve a pending legal-hold placement or release
      description: Admin-only second-person decision. Self-review is rejected. Placement creates the active hold before the action becomes terminal; release marks the hold released, restores bounded worker scheduling when due, and then records the terminal decision in one transaction.
      operationId: adminApproveDataRetentionLegalHoldAction
      security:
        - bearerAuth: []
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisionReference]
              properties:
                decisionReference: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{5,159}$" }
      responses:
        "200":
          description: Terminal independent decision and resulting hold state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRetentionLegalHoldMutationEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /admin/data-retention/legal-hold-actions/{actionId}/rejections:
    post:
      tags: [admin]
      summary: Independently reject a pending legal-hold placement or release
      description: Admin-only second-person decision. Rejecting placement restores bounded worker scheduling when the record is due; rejecting release leaves the active hold and disposal barrier unchanged.
      operationId: adminRejectDataRetentionLegalHoldAction
      security:
        - bearerAuth: []
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
