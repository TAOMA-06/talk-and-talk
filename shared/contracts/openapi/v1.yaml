              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "202":
          description: Independent approval recorded and bounded erasure queued; inspect execution progress on the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionCompletionEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
