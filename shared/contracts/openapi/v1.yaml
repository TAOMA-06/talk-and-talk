          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashLedgerClassificationEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/runs:
    get:
      tags: [admin, payments, commercial]
      summary: List bounded WeChat daily-bill reconciliation runs
      description: Finance and admin only. Each bill date is represented by four independent runs. A noStatement result is not proof of reconciliation and must be evaluated against local activity and issue records.
      operationId: adminListPaymentReconciliationRuns
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WeChatBillRunStatus"
        - name: billDate
          in: query
          description: WeChat bill date in the Asia/Shanghai calendar.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated immutable-run summaries, including hash verification and issue counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationRunListEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [admin, payments, commercial]
      summary: Establish the four WeChat reconciliation runs for a completed bill date
      description: Finance and admin only. The date must be a completed T+1 date within the provider lookback window. Creation is idempotent and records an audited request; it does not mean the bill date has reconciled.
      operationId: adminCreatePaymentReconciliationRuns
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeChatReconciliationRunsInput"
      responses:
        "200":
          description: Four run kinds established or their existing records preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationCreateRunsEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/runs/{id}/retry:
    post:
      tags: [admin, payments, commercial]
      summary: Retry a failed or provider no-statement WeChat reconciliation run before immutable import
      description: Finance and admin only. Retry is rejected unless the run is failed or returned noStatement and no immutable provider artifact has been imported. When a verified statement later becomes available, the previous missing-statement issue is closed automatically while any newly detected financial differences remain open.
      operationId: adminRetryPaymentReconciliationRun
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Failed or no-statement run returned to pending processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationRetryRunEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/issues:
    get:
      tags: [admin, payments, commercial]
      summary: List bounded WeChat bill-to-local reconciliation exceptions
      description: Finance and admin only. References are masked; open and investigating exceptions keep the corresponding bill-date evidence incomplete.
      operationId: adminListPaymentReconciliationIssues
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WeChatReconciliationIssueStatus"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/WeChatReconciliationIssueKind"
        - name: runId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated masked reconciliation exception records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationIssueListEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/issues/{id}/claims:
    post:
      tags: [admin, payments, commercial]
      summary: Atomically claim an open WeChat reconciliation exception
      description: Finance and admin only. Closed exceptions cannot be claimed, and an exception already assigned to another operator fails closed.
      operationId: adminClaimPaymentReconciliationIssue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Claimed exception moved to investigating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationIssueEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/issues/{id}/resolutions:
    post:
      tags: [admin, payments, commercial]
      summary: Submit immutable evidence for independent reconciliation review
      description: Only the current assignee may submit. The issue remains investigating and blocks release until another finance/admin actor approves; acceptedException additionally requires an admin approver.
      operationId: adminSubmitPaymentReconciliationResolution
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWeChatReconciliationResolutionInput"
      responses:
        "200":
          description: Investigating issue with one immutable pending resolution proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationIssueEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/issues/{id}/resolution-reviews:
    post:
      tags: [admin, payments, commercial]
      summary: Independently approve or reject a reconciliation resolution proposal
      description: The reviewer must differ from the proposer. Approval closes an issue only while it remains investigating and after the immutable proposal is approved in the same transaction; acceptedException requires admin. Rejection preserves the proposal and does not alter the issue state, including when provider recovery already made the proposal stale.
      operationId: adminReviewPaymentReconciliationResolution
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewWeChatReconciliationResolutionInput"
      responses:
        "200":
          description: Issue with approved terminal disposition or preserved rejected proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatPaymentReconciliationIssueEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-disputes:
    get:
      tags: [admin, payments, support]
