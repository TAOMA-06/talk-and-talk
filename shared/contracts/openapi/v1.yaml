      type: object
      additionalProperties: false
      required: [resolutionCode]
      properties:
        resolutionCode:
          type: string
          enum: [failedBeforeSendReviewed, providerRejectedReviewed, uncertainProviderStateReconciled]
          description: Must match the exact terminal status retained by the service; uncertainProviderStateReconciled records provider reconciliation but never permits an automatic resend.
        note:
          type: string
          maxLength: 500
          pattern: "^[^\\x00-\\x1F\\x7F]*$"
        evidenceRef:
          type: string
          maxLength: 300
          pattern: "^[A-Za-z0-9][A-Za-z0-9:/._-]*$"
    AvailabilityReminderTerminalResolution:
      type: object
      additionalProperties: false
      required: [id, terminalStatus, resolved, idempotent, automaticResend, operationalResolvedAt, operationalResolvedById, resolutionCode, note, evidenceRef]
      properties:
        id: { type: string, format: uuid }
        terminalStatus: { type: string, enum: [failedBeforeSend, rejected, uncertain] }
        resolved: { type: boolean, enum: [true] }
        idempotent: { type: boolean }
        automaticResend: { type: boolean, enum: [false], description: A terminal reconciliation never resends or restores the one-time authorization. }
        operationalResolvedAt: { type: string, format: date-time }
        operationalResolvedById: { type: string, format: uuid }
        resolutionCode: { type: string, enum: [failedBeforeSendReviewed, providerRejectedReviewed, uncertainProviderStateReconciled] }
        note: { type: string, nullable: true, maxLength: 500 }
        evidenceRef: { type: string, nullable: true, maxLength: 300 }
