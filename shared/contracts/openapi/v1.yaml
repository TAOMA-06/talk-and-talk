      summary: Get a snapshot-backed ranked companion card feed
      description: Every placement excludes the current user's recommendation-only companion exclusions, even when personalization is disabled. Explicit `/companions` public-catalog search is intentionally unaffected. A preference change expires active cursors before another page can be served.
      operationId: listRecommendedCompanions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: placement
          schema: { type: string, enum: [discoverHome, communityRelated, orderFollowup], default: discoverHome }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: themeId
          schema: { type: string, enum: [t1, t2, t3, t4, t5, t6] }
      responses:
        "200":
          description: Ranked companion cards with opaque impression ids, reason codes, and a short-lived cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "410":
          $ref: "#/components/responses/Error"
  /recommendations/events:
    post:
      tags: [recommendations]
      summary: Record idempotent recommendation card view/click events
      operationId: recordRecommendationEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [impressionId, type]
                    properties:
                      impressionId: { type: string, format: uuid }
                      type: { type: string, enum: [view, click] }
      responses:
        "201":
          description: Number of newly recorded events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/status:
    get:
      tags: [orders]
      summary: Orders module status
      operationId: ordersStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders:
    get:
      tags: [orders]
      summary: List current user orders
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, paying, paid, inService, completed, cancelled, refunded] } }
        - { name: view, in: query, schema: { type: string, enum: [all, active, history], default: all } }
      responses:
        "200":
          description: Stable paginated order history; active and history views are server authoritative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrdersEnvelope"
    post:
      tags: [orders]
      summary: Create pending order
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companionId, themeId, durationMinutes, scheduledAt]
              properties:
                companionId: { type: string }
                serviceOfferingId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Required in commercial release mode. It must identify a current active offering belonging to companionId; its server-side price and duration are authoritative and frozen on the order. Optional only for controlled internal legacy compatibility.
                availabilityWindowId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Required in commercial release mode. It must be the structured availability window returned by listCompanionAvailability; scheduledAt must be a 30-minute candidate fully contained by this active window. The server records a capacity snapshot and rechecks it at confirmation and prepay. Optional only for controlled internal legacy compatibility.
                themeId: { type: string }
                durationMinutes:
                  type: integer
                  minimum: 30
                  maximum: 240
                  description: Must exactly match the selected service offering's duration when serviceOfferingId is supplied.
                scheduledAt: { type: string, format: date-time, description: Must fall within the server-configured commercial booking horizon. With availabilityWindowId it is the selected candidate start time and must use a 30-minute boundary. }
                serviceIntent:
                  type: string
                  enum: [listen, comfort, organize, advice, lightCompanionship]
                  description: Required in commercial release mode. The selected intent is frozen with the server policy version on the order so both participants can distinguish listening, comfort, thought organization, general advice, and light companionship without creating a diagnosis or outcome promise.
                clientRequestId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  description: Required in commercial release mode and stable across retries so one user action creates at most one order.
                recommendationImpressionId: { type: string, format: uuid, description: Optional card impression attribution, valid for 24 hours. }
      responses:
        "400":
          description: Invalid duration or schedule outside the allowed booking window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "201":
          description: Created order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderDto"
        "409":
          description: Per-user or companion intake limit reached, an availability candidate/window is no longer valid or full, or an idempotency key was reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Commercial intake requires clientRequestId, serviceOfferingId, availabilityWindowId, and an explicit serviceIntent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Order intake is paused, the approved refund-policy snapshot is unavailable, or the controlled global open-order capacity is reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/service/today:
    get:
      tags: [orders, companions]
      summary: List the eligible companion owner's Beijing-today service checklist
      description: >-
        Returns only the caller's service entries whose appointment start falls in
        [00:00, 24:00) for Asia/Shanghai. It is a read-only workbench feed: no
        customer identity, conversation, refund, settlement, payment, or internal
        order fields are returned, and it never creates a schedule, reminder, or
        fulfillment action. pendingConfirmationCount is a separate count of the
        caller's still-unconfirmed pending requests; handling remains in the
        existing order flow.
      operationId: listMyCompanionTodayServiceChecklist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Today checklist ordered by scheduled appointment start
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompanionTodayServiceSchedule"
        "403":
          description: The authenticated account is not an active identity-verified companion owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No companion profile belongs to the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}:
    get:
      tags: [orders]
      summary: Get a role-aware order detail for either assigned participant
      description: >-
        Available only to the customer who created the order or the owner of the
        assigned companion profile. The response carries the server-derived
        viewerRole, a participant-safe fulfillmentBlockedByRefund flag, and a
        stable attendanceDispute summary when one exists, plus a server-derived
        attendanceDisputeEligibility object with opensAt, createDeadlineAt,
        eligibility, reasonCode and a user-safe reason. Companion responses do
        not include customer-only refund statements, review notes, or private
        experience feedback. A nonparticipant receives the same 404 as a missing
        order so appointment existence is not disclosed.
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderDto"
        "404":
          description: Order missing or the authenticated user is not either assigned participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/timeline:
    get:
      tags: [orders]
      summary: List participant-safe order timeline events, including reschedule request facts when present
      operationId: listOrderTimeline
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Chronological order activity visible to the customer and the companion owner only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orderId, items, pagination]
                        properties:
                          orderId: { type: string }
                          items:
                            type: array
                            maxItems: 100
                            items:
                              $ref: "#/components/schemas/OrderTimelineEvent"
                          pagination:
                            $ref: "#/components/schemas/BoundedPagination"
        "404":
          description: Order not found or caller is not an order participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/voice-room/access:
    post:
      tags: [orders]
      summary: Issue a short-lived, order-scoped real-time voice room credential
      description: Available only to the customer or companion owner of a voice SKU after current legal consent, the Mini Program's explicit TRTC third-party processing confirmation, manual acceptance, payment, and the companion's explicit service start. The client delays SDK loading and microphone authorization until that feature-level confirmation. The server derives the room and participant identity; callers cannot choose either. UserSig and privateMapKey are short-lived response secrets and must not be persisted by clients. The configured service is audio-only; the platform does not enable cloud recording or AI transcription by default. A refund, service completion, or elapsed service window can terminate an already connected room server-side; clients must handle the provider kicked-out event.
      operationId: issueOrderVoiceRoomAccess
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: A short-lived TRTC access credential for this order participant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VoiceRoomAccess"
        "404":
          description: Order not found or caller is not an order participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Current legal consent or server-authoritative adult eligibility is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Order is not a voice service, is not accepted/started, is in after-sales handling, or its service window has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Real-time voice, room control, or the operator's TRTC privacy-disclosure approval is not configured, or the signing provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/reschedule-requests:
    post:
      tags: [orders]
      summary: Submit a participant reschedule proposal without changing the current appointment
      description: The customer or companion owner may propose one future time. A structured order must supply an active structured availability window containing that candidate; the original order time, payment, refund and fulfillment state remain unchanged until a separate response accepts the proposal.
      operationId: createOrderRescheduleRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedScheduledAt]
              properties:
                requestedScheduledAt:
                  type: string
                  format: date-time
                  description: Must be future, within the commercial booking horizon, and leave at least 15 minutes before a service can start.
                availabilityWindowId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Required when the original order uses structured availability. It must be an active companion window that contains the candidate and has current capacity.
      responses:
        "201":
          description: Pending proposal recorded and the other participant notified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderRescheduleRequest"
        "400":
          description: Requested time is invalid or outside the commercial booking horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Order state, current capacity, refund state, existing proposal, or response window prevents a new proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: A structured appointment did not include a new availability window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/reschedule-requests/{requestId}/accept:
    post:
      tags: [orders]
      summary: Accept the other participant's reschedule proposal and atomically replace the booking slot
      description: The requester cannot accept their own proposal. The server locks the order, request and current candidate availability, then rechecks request expiry, refund state, appointment state and capacity before replacing the order's scheduled time and availability snapshot.
      operationId: acceptOrderRescheduleRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Proposal accepted and order appointment snapshot atomically updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [rescheduleRequest, order]
                        properties:
                          rescheduleRequest:
                            $ref: "#/components/schemas/OrderRescheduleRequest"
                          order:
                            type: object
                            description: Updated order DTO, including its new scheduledAt and availabilitySnapshot.
        "403":
          description: The request creator attempted to accept their own proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order or reschedule request not found, or caller is not an order participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Proposal expired, order changed state, a refund began, or the candidate is no longer available/capable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/reschedule-requests/{requestId}/reject:
    post:
      tags: [orders]
      summary: Reject the other participant's reschedule proposal without changing the booking
      description: The requester cannot reject their own proposal. The server locks the order and request, confirms the caller is the other order participant, and records a rejection only while the proposal remains pending and valid. The order appointment, payment, refund and fulfillment state remain unchanged.
      operationId: rejectOrderRescheduleRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Proposal rejected and its requester notified; the existing booking is unchanged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderRescheduleRequest"
        "403":
          description: The request creator attempted to reject their own proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order or reschedule request not found, or caller is not an order participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Proposal has expired or is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Cancel pending/paying order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/completion-confirmations:
    post:
      tags: [orders]
      summary: Let the customer explicitly confirm a completed service without shortening the refund window
      operationId: confirmOrderCompletion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Completion confirmation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/service-guidelines-confirmations:
    post:
      tags: [orders]
      summary: Record one participant's pre-service acknowledgement of platform communication, service scope, and safety boundaries
      operationId: confirmOrderServiceGuidelines
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Role-specific service-guidelines acknowledgement recorded; it does not change payment, refund, or service-start eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/experience-feedback:
    post:
      tags: [orders]
      summary: Record one private customer experience-feedback submission for a completed order
      description: This is not a public companion review and cannot change order, refund, or settlement state. Free-text notes are moderated before storage; customers who need help use the existing order support-ticket flow.
      operationId: submitOrderExperienceFeedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum: [communicationClear, boundaryRespected, onTime, asExpected, needsImprovement]
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Private feedback recorded, or the original private feedback returned for a retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /orders/{id}/prepay:
    post:
      tags: [orders]
      summary: WeChat App, Mini Program, or Native QR prepay
      operationId: prepayOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [app, miniProgram, native]
                  default: app
      responses:
        "201":
          description: Prepay params (mock=true on staging when using mock provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /community/reports/mine:
    get:
      tags: [community]
      summary: List the authenticated reporter's minimal community-report receipts
      description: >-
        Returns a stable bounded page of the caller's receipt ids, submission times, and the fixed intake state `received`.
        It never returns a post, author, reporter reason, moderation case, staff member, decision, SLA, or a claim
        that a risk has been resolved.
      operationId: listMyCommunityReportReceipts
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Private minimal report receipts for the authenticated reporter only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
  /community/posts:
    get:
      tags: [community]
      summary: List approved community posts
      operationId: listCommunityPosts
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Community post feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
    post:
      tags: [community]
      summary: Create a moderated community post
      operationId: createCommunityPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, topic, content]
