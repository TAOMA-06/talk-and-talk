openapi: 3.0.3
info:
  title: Talk&Talk API
  version: 0.1.0
  description: |
    Frozen public contract for `/api/v1`.
    All JSON responses use a uniform envelope (see components.schemas.SuccessEnvelope / ErrorEnvelope).
    Breaking changes require `/api/v2` or coordinated release notes.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-staging.talkandtalk.app/api/v1
    description: Staging
  - url: https://api.talkandtalk.app/api/v1
    description: Production
tags:
  - name: health
  - name: metrics
  - name: auth
  - name: users
  - name: companions
  - name: orders
  - name: payments
  - name: conversations
  - name: moderation
  - name: notifications
  - name: community
  - name: reviews
  - name: admin
  - name: admin-moderation
paths:
  /health:
    get:
      tags: [health]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Health snapshot (ok | degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics text
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format (text/plain)
  /auth/sms/send-code:
    post:
      tags: [auth]
      summary: Send SMS verification code
      operationId: sendSmsCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "13800138000"
      responses:
        "200":
          description: Code sent (mock logs code in development/staging)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresInSeconds:
                            type: integer
        "429":
          $ref: "#/components/responses/Error"
  /auth/phone/login:
    post:
      tags: [auth]
      summary: Phone + code login
      operationId: phoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/apple:
    post:
      tags: [auth]
      summary: Apple Sign-In
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
  /auth/wechat/mini-program:
    post:
      tags: [auth]
      summary: Sign in with WeChat Mini Program code
      operationId: wechatMiniProgramLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Short-lived credential returned by wx.login
      responses:
        "200":
          description: Token pair + new or existing WeChat user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/wechat/mini-program/status:
    get:
      tags: [auth]
      summary: Check whether server-side Mini Program credentials are configured
      operationId: wechatMiniProgramStatus
      security: []
      responses:
        "200":
          description: Configuration readiness without credential values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, configured]
                        properties:
                          module: { type: string, enum: [wechatMiniProgram] }
                          status: { type: string, enum: [configured, unconfigured] }
                          configured: { type: boolean }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access/refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me:
    get:
      tags: [users]
      summary: Current user (legacy path)
      operationId: getUsersMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me:
    get:
      tags: [users]
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [users]
      summary: Update profile (displayName, gender, etc.)
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                gender: { type: string, enum: [female, male, other, undisclosed] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me/deletion-request:
    post:
      tags: [users]
      summary: Request account deletion
      operationId: requestDeletion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions/status:
    get:
      tags: [companions]
      summary: Companions module status
      operationId: companionsStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions:
    get:
      tags: [companions]
      summary: List companions
      operationId: listCompanions
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: availability
          schema: { type: string }
        - in: query
          name: isOnline
          schema: { type: boolean }
      responses:
        "200":
          description: Companion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions/{id}:
    get:
      tags: [companions]
      summary: Companion detail
      operationId: getCompanion
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /recommendations/topics:
    get:
      tags: [recommendations]
      summary: List the stable companion recommendation topics
      operationId: listRecommendationTopics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Topic catalog and algorithm version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/me/preferences:
    get:
      tags: [recommendations]
      summary: Read the current user's recommendation settings and removable behavioral tags
      operationId: getRecommendationPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recommendation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [recommendations]
      summary: Update recommendation settings
      description: Disabling personalization keeps non-personalized discovery available and stops preference/history-based ranking.
      operationId: updateRecommendationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personalizationEnabled: { type: boolean }
                topicIds: { type: array, maxItems: 6, items: { type: string, enum: [t1, t2, t3, t4, t5, t6] } }
                city: { type: string, nullable: true }
                maxPricePerHalfHour: { type: integer, minimum: 1, maximum: 10000, nullable: true }
                preferredTimeSlots: { type: array, maxItems: 12, items: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" } }
      responses:
        "200":
          description: Updated recommendation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/me/tags/{id}:
    delete:
      tags: [recommendations]
      summary: Delete one behavioral recommendation tag
      operationId: deleteRecommendationBehavioralTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Tag deleted and excluded from future behavioral ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/companions:
    get:
      tags: [recommendations]
      summary: Get a snapshot-backed ranked companion card feed
      operationId: listRecommendedCompanions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: placement
          schema: { type: string, enum: [discoverHome, communityRelated, orderFollowup], default: discoverHome }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: themeId
          schema: { type: string, enum: [t1, t2, t3, t4, t5, t6] }
      responses:
        "200":
          description: Ranked companion cards with opaque impression ids, reason codes, and a short-lived cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "410":
          $ref: "#/components/responses/Error"
  /recommendations/events:
    post:
      tags: [recommendations]
      summary: Record idempotent recommendation card view/click events
      operationId: recordRecommendationEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [impressionId, type]
                    properties:
                      impressionId: { type: string, format: uuid }
                      type: { type: string, enum: [view, click] }
      responses:
        "200":
          description: Number of newly recorded events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/status:
    get:
      tags: [orders]
      summary: Orders module status
      operationId: ordersStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders:
    get:
      tags: [orders]
      summary: List current user orders
      operationId: listOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [orders]
      summary: Create pending order
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companionId, themeId, durationMinutes, scheduledAt]
              properties:
                companionId: { type: string }
                themeId: { type: string }
                durationMinutes: { type: integer, minimum: 30, maximum: 240 }
                scheduledAt: { type: string, format: date-time }
                recommendationImpressionId: { type: string, format: uuid, description: Optional card impression attribution, valid for 24 hours. }
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}:
    get:
      tags: [orders]
      summary: Order detail
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Cancel pending/paying order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/prepay:
    post:
      tags: [orders]
      summary: WeChat App or Mini Program prepay
      operationId: prepayOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [app, miniProgram]
                  default: app
      responses:
        "200":
          description: Prepay params (mock=true on staging when using mock provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /community/posts:
    get:
      tags: [community]
      summary: List approved community posts
      operationId: listCommunityPosts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Community post feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [community]
      summary: Create a moderated community post
      operationId: createCommunityPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, topic, content]
              properties:
                kind: { type: string, enum: [femaleRequest, malePromotion] }
                topic: { type: string, maxLength: 80 }
                content: { type: string, maxLength: 2000 }
                coverImageUrl: { type: string }
      responses:
        "200":
          description: Moderated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /community/posts/{id}/like:
    post:
      tags: [community]
      summary: Set current user's like state
      operationId: setCommunityPostLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /reviews/companion/{id}:
    get:
      tags: [reviews]
      summary: List companion reviews
      operationId: listCompanionReviews
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reviews for the companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /reviews:
    post:
      tags: [reviews]
      summary: Review a completed order
      operationId: createReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, rating, content]
              properties:
                orderId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/refund:
    post:
      tags: [orders]
      summary: Create refund skeleton
      operationId: refundOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Refund transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/status:
    get:
      tags: [payments]
      summary: Payments module status
      operationId: paymentsStatus
      responses:
        "200":
          description: Active payment provider and production readiness
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, provider, productionReady]
                        properties:
                          module: { type: string, enum: [payments] }
                          status: { type: string, enum: [active, unavailable] }
                          provider: { type: string, enum: [real, mock, disabled] }
                          productionReady: { type: boolean }
  /payments/wechat/notify:
    post:
      tags: [payments]
      summary: WeChat Pay notify callback
      operationId: wechatNotify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Notify accepted
  /payments/wechat/mock-notify:
    post:
      tags: [payments]
      summary: Simulate successful payment only when the mock provider is active
      operationId: wechatMockNotify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outTradeNo]
              properties:
                outTradeNo: { type: string }
      responses:
        "200":
          description: Mock notify applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/review-queue:
    get:
      tags: [payments]
      summary: List refunds awaiting staff action
      operationId: listRefundReviewQueue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending-review and failed refunds (moderator/admin only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/approve:
    post:
      tags: [payments]
      summary: Approve a pending refund
      operationId: approveRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Refund approved and submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/reject:
    post:
      tags: [payments]
      summary: Reject a pending refund
      operationId: rejectRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Refund rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /payments/refunds/{id}/retry:
    post:
      tags: [payments]
      summary: Retry a failed refund with its original refund reference
      operationId: retryRefund
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Refund retry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /conversations/status:
    get:
      tags: [conversations]
      summary: Conversations module status
      operationId: conversationsStatus
      responses:
        "200":
          description: Status including whether media messaging is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /conversations/{id}/status:
    get:
      tags: [conversations]
      summary: Viewer-specific chat delivery status
      operationId: conversationDeliveryStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Media availability and active chat-only restriction, if any
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mediaEnabled: { type: boolean }
                          chatRestriction:
                            nullable: true
                            $ref: "#/components/schemas/ChatRestriction"
  /conversations:
    get:
      tags: [conversations]
      summary: List user conversations
      operationId: listConversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /conversations/{id}/messages:
    get:
      tags: [conversations]
      summary: List messages
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Messages page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [conversations]
      summary: Send message (moderation pipeline)
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 2000 }
                attachmentIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string }
              anyOf:
                - required: [content]
                - required: [attachmentIds]
      responses:
        "200":
          description: Message + moderation decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /conversations/{id}/media-uploads:
    post:
      tags: [conversations]
      summary: Reserve a short-lived direct media upload
      operationId: reserveConversationMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mimeType, sizeBytes, sha256]
