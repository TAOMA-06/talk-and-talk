openapi: 3.0.3
info:
  title: Talk&Talk API
  version: 0.1.0
  description: |
    Frozen public contract for `/api/v1`.
    All JSON responses use a uniform envelope (see components.schemas.SuccessEnvelope / ErrorEnvelope).
    Breaking changes require `/api/v2` or coordinated release notes.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-staging.talkandtalk.app/api/v1
    description: Staging
  - url: https://api.talkandtalk.app/api/v1
    description: Production
tags:
  - name: health
  - name: metrics
  - name: auth
  - name: users
  - name: companions
  - name: orders
  - name: payments
  - name: conversations
  - name: moderation
  - name: notifications
  - name: legal
  - name: support
  - name: commercial
  - name: community
  - name: reviews
  - name: admin
  - name: admin-moderation
paths:
  /legal/terms:
    get:
      tags: [legal]
      summary: Current immutable terms snapshot
      operationId: getCurrentTerms
      security: []
      responses:
        "200":
          description: HTML terms document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/privacy:
    get:
      tags: [legal]
      summary: Current immutable privacy-policy snapshot
      operationId: getCurrentPrivacyPolicy
      security: []
      responses:
        "200":
          description: HTML privacy-policy document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/platform-rules:
    get:
      tags: [legal]
      summary: Current immutable platform-rules snapshot
      operationId: getCurrentPlatformRules
      security: []
      responses:
        "200":
          description: HTML platform-rules document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/{document}/versions/{version}:
    get:
      tags: [legal]
      summary: Retrieve a previously published immutable legal-document version
      operationId: getLegalDocumentVersion
      security: []
      parameters:
        - name: document
          in: path
          required: true
          schema: { type: string, enum: [terms, privacy, platform-rules] }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Archived HTML legal document
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Health snapshot (ok | degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics text
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format (text/plain)
  /auth/sms/send-code:
    post:
      tags: [auth]
      summary: Send SMS verification code
      operationId: sendSmsCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "13800138000"
      responses:
        "200":
          description: Code sent (mock logs code in development/staging)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresInSeconds:
                            type: integer
        "429":
          $ref: "#/components/responses/Error"
  /auth/phone/login:
    post:
      tags: [auth]
      summary: Phone + code login
      operationId: phoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/apple:
    post:
      tags: [auth]
      summary: Apple Sign-In
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
      responses:
        "200":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
  /auth/wechat/mini-program:
    post:
      tags: [auth]
      summary: Sign in with WeChat Mini Program code
      operationId: wechatMiniProgramLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Short-lived credential returned by wx.login
      responses:
        "200":
          description: Token pair + new or existing WeChat user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /auth/wechat/mini-program/status:
    get:
      tags: [auth]
      summary: Check whether server-side Mini Program credentials are configured
      operationId: wechatMiniProgramStatus
      security: []
      responses:
        "200":
          description: Configuration readiness without credential values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, configured]
                        properties:
                          module: { type: string, enum: [wechatMiniProgram] }
                          status: { type: string, enum: [configured, unconfigured] }
                          configured: { type: boolean }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access/refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me:
    get:
      tags: [users]
      summary: Current user (legacy path)
      operationId: getUsersMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me:
    get:
      tags: [users]
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [users]
      summary: Update profile (displayName, gender, etc.)
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
                gender: { type: string, enum: [female, male] }
                age: { type: integer, minimum: 18, maximum: 120 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Display name failed public-profile moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/deletion-request:
    post:
      tags: [users]
      summary: Request account deletion
      operationId: requestDeletion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions/status:
    get:
      tags: [companions]
      summary: Companions module status
      operationId: companionsStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions:
    get:
      tags: [companions]
      summary: List companions
      operationId: listCompanions
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: availability
          schema: { type: string }
        - in: query
          name: isOnline
          schema: { type: boolean }
      responses:
        "200":
          description: Companion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions/me/profile:
    get:
      tags: [companions]
      summary: Get the current user's companion profile
      operationId: getOwnCompanionProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [companions]
      summary: Update availability or moderated public companion profile content
      operationId: updateOwnCompanionProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, minLength: 1, maxLength: 500 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                availability: { type: string, enum: [online, available, busy] }
      responses:
        "200":
          description: Updated companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Public profile content failed moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/application:
    post:
      tags: [companions]
      summary: Submit an unpublished companion application for staff review
      operationId: applyForCompanion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, bio, pricePerHalfHour, tags, availableTimes, languages, specialties, cityDistrict]
              properties:
                role: { type: string, minLength: 1, maxLength: 80 }
                bio: { type: string, minLength: 1, maxLength: 500 }
                pricePerHalfHour: { type: integer, minimum: 1, maximum: 10000 }
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 40 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                languages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, maxLength: 40 }
                specialties:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 60 }
                topicIds:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 80 }
                cityDistrict: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Unpublished companion application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Application public content failed moderation and was not submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the application was not submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/{id}:
    get:
      tags: [companions]
      summary: Companion detail
      operationId: getCompanion
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /recommendations/topics:
    get:
      tags: [recommendations]
      summary: List the stable companion recommendation topics
      operationId: listRecommendationTopics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Topic catalog and algorithm version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/me/preferences:
    get:
      tags: [recommendations]
      summary: Read the current user's recommendation settings and removable behavioral tags
      operationId: getRecommendationPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recommendation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [recommendations]
      summary: Update recommendation settings
      description: Disabling personalization keeps non-personalized discovery available and stops preference/history-based ranking.
      operationId: updateRecommendationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personalizationEnabled: { type: boolean }
                topicIds: { type: array, maxItems: 6, items: { type: string, enum: [t1, t2, t3, t4, t5, t6] } }
                city: { type: string, nullable: true }
                maxPricePerHalfHour: { type: integer, minimum: 1, maximum: 10000, nullable: true }
                preferredTimeSlots: { type: array, maxItems: 12, items: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" } }
      responses:
        "200":
          description: Updated recommendation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/me/tags/{id}:
    delete:
      tags: [recommendations]
      summary: Delete one behavioral recommendation tag
      operationId: deleteRecommendationBehavioralTag
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Tag deleted and excluded from future behavioral ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /recommendations/companions:
    get:
      tags: [recommendations]
      summary: Get a snapshot-backed ranked companion card feed
      operationId: listRecommendedCompanions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: placement
          schema: { type: string, enum: [discoverHome, communityRelated, orderFollowup], default: discoverHome }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: themeId
          schema: { type: string, enum: [t1, t2, t3, t4, t5, t6] }
      responses:
        "200":
          description: Ranked companion cards with opaque impression ids, reason codes, and a short-lived cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "410":
          $ref: "#/components/responses/Error"
  /recommendations/events:
    post:
      tags: [recommendations]
      summary: Record idempotent recommendation card view/click events
      operationId: recordRecommendationEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [impressionId, type]
                    properties:
                      impressionId: { type: string, format: uuid }
                      type: { type: string, enum: [view, click] }
      responses:
        "200":
          description: Number of newly recorded events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/status:
    get:
      tags: [orders]
      summary: Orders module status
      operationId: ordersStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders:
    get:
      tags: [orders]
      summary: List current user orders
      operationId: listOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [orders]
      summary: Create pending order
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companionId, themeId, durationMinutes, scheduledAt]
              properties:
                companionId: { type: string }
                themeId: { type: string }
                durationMinutes: { type: integer, minimum: 30, maximum: 240 }
                scheduledAt: { type: string, format: date-time, description: Must fall within the server-configured commercial booking horizon. }
                clientRequestId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  description: Required in commercial release mode and stable across retries so one user action creates at most one order.
                recommendationImpressionId: { type: string, format: uuid, description: Optional card impression attribution, valid for 24 hours. }
      responses:
        "400":
          description: Invalid duration or schedule outside the allowed booking window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "200":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: Per-user or companion intake limit reached, or an idempotency key was reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Commercial intake requires a clientRequestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Order intake is paused or the controlled global open-order capacity is reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}:
    get:
      tags: [orders]
      summary: Order detail
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Cancel pending/paying order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /orders/{id}/completion-confirmations:
    post:
      tags: [orders]
      summary: Let the customer explicitly confirm a completed service without shortening the refund window
      operationId: confirmOrderCompletion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Completion confirmation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/prepay:
    post:
      tags: [orders]
      summary: WeChat App or Mini Program prepay
      operationId: prepayOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [app, miniProgram]
                  default: app
      responses:
        "200":
          description: Prepay params (mock=true on staging when using mock provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /community/posts:
    get:
      tags: [community]
      summary: List approved community posts
      operationId: listCommunityPosts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Community post feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [community]
      summary: Create a moderated community post
      operationId: createCommunityPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, topic, content]
              properties:
                kind: { type: string, enum: [femaleRequest, malePromotion] }
                topic: { type: string, maxLength: 80 }
                content: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Moderated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: Community media is fail-closed until the approved media review pipeline is enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /community/posts/{id}/like:
    post:
      tags: [community]
      summary: Set current user's like state
      operationId: setCommunityPostLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /reviews/companion/{id}:
    get:
      tags: [reviews]
      summary: List companion reviews
      operationId: listCompanionReviews
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reviews for the companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /reviews:
    post:
      tags: [reviews]
      summary: Review a completed order
      operationId: createReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, rating, content]
              properties:
                orderId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Review content failed moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the review was not created
          content:
            application/json:
              schema:
