  /admin/account-deletions/{id}/complete:
    post:
      tags: [admin]
      summary: Approve and enqueue a settled account deletion as the second administrator
      description: Admin-only second-person control. The caller must differ from processingStartedById. Every obligation and the external legal approval are checked before immutable approval provenance is recorded. The response is accepted, not completed; a leased, crash-resumable worker then erases one bounded table batch per transaction. The request remains processing and the account remains restricted until final postconditions pass, all rating-refresh outbox jobs finish, the seven-row retention ledger commits, and the account is banned atomically.
      operationId: adminCompleteAccountDeletion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
