      responses:
        "200":
          description: Terminal proposal metadata without raw content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatMerchantBillImportEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
