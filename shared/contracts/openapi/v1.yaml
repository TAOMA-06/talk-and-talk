          in: query
          schema: { type: string, maxLength: 128 }
          description: Load messages strictly before this verified same-conversation message cursor.
        - name: after
          in: query
          schema: { type: string, maxLength: 128 }
          description: Load messages strictly after this verified same-conversation message cursor. before and after are mutually exclusive.
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 5, maximum: 100, default: 50 }
      responses:
        "200":
          description: Case-scoped conversation evidence
