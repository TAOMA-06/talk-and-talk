  /admin/users/{id}/account-status:
    patch:
      tags: [admin]
      summary: Create or revoke an ordinary-consumer account action
      description: Restriction and ban create a versioned action with a 30-day appeal window and revoke refresh tokens. Every new action requires a controlled source type, an originating-record reference, and an evidence-vault reference; the server stores those references with a SHA-256 digest of the normalized action metadata, while the user-facing action omits all private evidence fields. Companion and staff targets fail closed. A new restriction or ban is rejected while the consumer has a paying/paid/in-service order, a pending refund, an unresolved payment or attendance dispute, or an open/in-progress support ticket. Active restoration cannot bypass a pending appeal or a processing/completed deletion, remains available so existing commercial obligations can be fulfilled, and may optionally reference the active userAccountAction.
      operationId: adminUpdateAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [status, reasonCode, reason, sourceType, sourceReference, evidenceReference]
                  properties:
                    status: { type: string, enum: [restricted, banned] }
                    reasonCode:
                      type: string
                      minLength: 3
                      maxLength: 80
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
                    reason: { type: string, minLength: 3, maxLength: 500, description: User-facing action message; never raw evidence. }
                    sourceType:
                      type: string
                      enum: [moderationCase, supportTicket, paymentDispute, attendanceDispute, conversationSafety, manualSafetyReview, legalCompliance]
                    sourceReference:
                      type: string
                      minLength: 6
                      maxLength: 160
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
                      description: Controlled originating-record reference. Raw evidence, URLs with credentials, and free text are forbidden.
                    evidenceReference:
                      type: string
                      minLength: 6
                      maxLength: 160
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
                      description: Controlled evidence-vault reference only; no attachment body, transcript, identity document, payment data, or secret.
                - type: object
                  additionalProperties: false
                  required: [status, reason]
                  properties:
                    status: { type: string, enum: [active] }
                    reason: { type: string, minLength: 3, maxLength: 500, description: User-facing restoration message. }
                    sourceType: { type: string, enum: [userAccountAction] }
                    sourceReference:
                      type: string
                      minLength: 6
                      maxLength: 160
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
                      description: Optional active UserAccountAction identifier; when supplied it must match the action being revoked.
      responses:
        "200":
          description: Formal action created/revoked or an idempotent current result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Conflict with account governance or active commercial obligations. ACCOUNT_ACTION_HAS_ACTIVE_COMMERCIAL_OBLIGATIONS returns stable per-category counts so staff can route the case to fulfillment, refund, dispute, or support handling first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                activeCommercialObligations:
                  summary: Paid-service and dispute obligations must be settled first
                  value:
                    error:
                      code: ACCOUNT_ACTION_HAS_ACTIVE_COMMERCIAL_OBLIGATIONS
                      message: Settle active paid-service, refund, dispute, and support obligations before restricting or banning the account
                      details:
                        total: 5
                        counts:
                          orders: 1
                          refunds: 1
                          paymentDisputes: 1
                          attendanceDisputes: 1
                          supportTickets: 1
                    meta:
                      requestId: req_account_action_01
                      timestamp: "2026-08-01T00:00:00.000Z"
