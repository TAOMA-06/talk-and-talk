        - name: restrictionId
          in: query
          description: Exact active restriction ID used to resolve its owner-scoped appealable case
          schema: { type: string, maxLength: 191 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current-user appealable action list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
