  /support/tickets/{id}:
    get:
      tags: [support]
      summary: Read one requester-owned support ticket
      description: Returns only a ticket created by the current user and only that requester's voluntary private order facts.
      operationId: getMySupportTicket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Requester-safe support ticket detail
          content:
            application/json:
              schema:
