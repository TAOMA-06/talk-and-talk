        capacity: { type: integer, minimum: 1, maximum: 10 }
        timezone: { type: string, enum: [Asia/Shanghai] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnCompanionAvailabilityBlackout:
      type: object
      required: [id, startsAt, endsAt, timezone, isActive, createdAt, updatedAt]
      description: Private owner scheduling exception. It is not a public cancellation, notification, or change to an existing booking.
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, enum: [Asia/Shanghai] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnCompanionRecurringAvailabilityDraft:
      type: object
      additionalProperties: false
      required: [id, startsAt, endsAt, capacity, recurringAvailabilityRuleId, recurringOccurrenceStartsAt, createdAt]
      description: Private generated occurrence inside the fixed owner-review horizon; it is not public until explicitly activated.
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 10 }
        recurringAvailabilityRuleId: { type: string }
        recurringOccurrenceStartsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CompanionTodayServiceEntry:
      type: object
      required: [id, scheduledAt, durationMinutes, status, serviceTitle]
      description: Minimal owner-only workbench item; it intentionally contains no customer, conversation, refund, settlement, payment, or internal order fields.
      properties:
        id: { type: string }
        scheduledAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, paying, paid, inService, completed] }
        serviceTitle: { type: string }
    CompanionTodayServiceSchedule:
      type: object
      required: [date, timezone, pendingConfirmationCount, items]
      description: Read-only list for one Asia/Shanghai calendar day. The date boundary is computed by the server from appointment start times.
      properties:
        date: { type: string, format: date, example: "2026-07-21" }
        timezone: { type: string, enum: [Asia/Shanghai] }
        pendingConfirmationCount:
          type: integer
          minimum: 0
          description: Caller-owned pending orders that still await companion confirmation; the count does not create a reminder or change an order.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanionTodayServiceEntry"
    OrderRescheduleRequest:
      type: object
      required: [id, requestedByRole, originalScheduledAt, requestedScheduledAt, requestedAvailabilitySnapshot, status, expiresAt, respondedAt]
      properties:
        id: { type: string }
        requestedByRole: { type: string, enum: [customer, companion] }
        originalScheduledAt: { type: string, format: date-time }
        requestedScheduledAt: { type: string, format: date-time }
        requestedAvailabilitySnapshot:
          type: object
          nullable: true
          required: [availabilityWindowId, startsAt, endsAt, capacity]
          properties:
            availabilityWindowId: { type: string }
            startsAt: { type: string, format: date-time, nullable: true }
            endsAt: { type: string, format: date-time, nullable: true }
            capacity: { type: integer, nullable: true, minimum: 1 }
        status: { type: string, enum: [pending, accepted, rejected, expired, cancelled] }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
    OrderTimelineEvent:
      type: object
      required: [id, type, actorRole, occurredAt, rescheduleRequest]
      properties:
        id: { type: string }
        type: { type: string, enum: [orderCreated, rescheduleRequested, rescheduleAccepted, rescheduleRejected, rescheduleExpired, rescheduleCancelled] }
        actorRole: { type: string, enum: [customer, companion, system] }
        occurredAt: { type: string, format: date-time }
        rescheduleRequest:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OrderRescheduleRequest"
    VoiceRoomAccess:
      type: object
      required: [provider, sdkAppId, roomId, userId, userSig, privateMapKey, participantRole, expiresAt, serviceEndsAt, participant]
      description: Short-lived connection material. It is valid only for the caller, room and service window returned by the server; clients must keep it in memory only.
      properties:
        provider: { type: string, enum: [trtc] }
        sdkAppId: { type: integer, minimum: 1 }
        roomId: { type: string, maxLength: 64, description: Opaque provider room identifier derived by the server. }
        userId: { type: string, maxLength: 32, description: Opaque provider participant identifier; not the platform account ID. }
        userSig: { type: string, minLength: 1, description: Short-lived provider credential; never persist or log. }
        privateMapKey: { type: string, minLength: 1, description: Provider room restriction for this participant; never persist or log. }
        participantRole: { type: string, enum: [customer, companion] }
        expiresAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        participant:
          type: object
          required: [name, initials]
          properties:
            name: { type: string, maxLength: 80 }
            initials: { type: string, maxLength: 16 }
    CompanionAvailabilityCandidate:
      type: object
      required: [id, availabilityWindowId, startsAt, endsAt, capacity, reservedCount, availableCapacity]
      properties:
        id: { type: string, description: Candidate identifier derived from its availability window and start time. }
        availabilityWindowId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        reservedCount: { type: integer, minimum: 0 }
        availableCapacity: { type: integer, minimum: 0 }
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string }
            role:
              type: string
              enum: [user, companion, moderator, admin]
            profile:
              type: object
              properties:
                displayName: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                gender: { type: string, nullable: true }
                isVerified: { type: boolean }
                safetyScore: { type: integer }
    MediaAttachment:
      type: object
      required: [id, kind, status, mimeType, sizeBytes]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, audio] }
        status: { type: string, enum: [reserved, uploaded, scanning, approved, reviewRequired, blocked, failed, expired] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: integer, nullable: true }
        url: { type: string, nullable: true, description: Short-lived authorized read URL only when viewer is permitted }
        expiresAt: { type: string, format: date-time, nullable: true }
    ControlledCaseEvidenceUploadInput:
      type: object
      additionalProperties: false
      required: [kind, mimeType, sizeBytes, sha256]
      properties:
        kind: { type: string, enum: [image, audio] }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, audio/mpeg, audio/mp4, audio/aac, audio/wav, audio/x-wav, audio/amr]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Images are capped at 10 MiB; audio is additionally capped at 8 MiB by the service.
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000
          description: Required for audio and forbidden from bypassing the 60-second limit.
    ControlledCaseEvidenceAsset:
      type: object
      additionalProperties: false
      required: [id, purpose, kind, status, mimeType, sizeBytes, durationMs, expiresAt]
      properties:
        id: { type: string, format: uuid }
        purpose:
          type: string
          enum: [orderSupportFact, attendanceDisputeStatement, companionIncidentReport]
        kind: { type: string, enum: [image, audio] }
        status:
          type: string
          enum: [reserved, uploaded, scanning, approved, reviewRequired, blocked, failed, expired]
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        durationMs: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    ControlledCaseEvidenceAttachment:
      type: object
      additionalProperties: false
      required: [id, kind, status, mimeType, sizeBytes, durationMs, expiresAt]
      properties:
        id: { type: string, format: uuid, description: Binding id used for the authorized read-url endpoint; not a storage key. }
        kind: { type: string, enum: [image, audio] }
        status: { type: string, enum: [approved] }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        durationMs: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    ControlledCaseEvidenceUploadReservationEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [asset, upload]
              properties:
                asset: { $ref: "#/components/schemas/ControlledCaseEvidenceAsset" }
                upload:
                  type: object
                  additionalProperties: false
                  required: [url, method, headers, expiresAt]
                  properties:
                    url: { type: string, writeOnly: true }
                    method: { type: string, enum: [PUT, POST] }
                    headers:
                      type: object
                      additionalProperties: { type: string }
                      writeOnly: true
                    expiresAt: { type: string, format: date-time }
    ControlledCaseEvidenceStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [asset]
              properties:
                asset: { $ref: "#/components/schemas/ControlledCaseEvidenceAsset" }
    ControlledCaseEvidenceReadUrlEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [attachmentId, kind, url, assetExpiresAt]
              properties:
                attachmentId: { type: string, format: uuid }
                kind: { type: string, enum: [image, audio] }
                url: { type: string, description: Short-lived provider-authorized URL; never persist or log. }
                assetExpiresAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, senderId, content, type, moderationStatus, visibility, attachments, timestamp]
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        senderName: { type: string, nullable: true }
        content: { type: string }
        type: { type: string, enum: [text, image, audio, system, safety] }
        moderationStatus: { type: string, enum: [queued, pendingReview, published, blocked, removed] }
        visibility: { type: string, enum: [participants, senderOnly, staffOnly] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/MediaAttachment" }
        timestamp: { type: string, format: date-time }
    ConversationSummary:
      type: object
      required: [id, companionId, viewerRole, participant, lastMessage, unreadCount, messageNotificationsMuted, conversationBlockedByYou, messageHistoryAvailable, messageInteractionAvailable, updatedAt]
      properties:
        id:
          type: string
          description: The caller's authorized chat route identifier; it is a public companion id for a customer and an internal conversation id for the companion owner.
        companionId: { type: string }
        viewerRole: { type: string, enum: [customer, companion] }
        participant:
          type: object
          required: [id, name, role, initials, isOnline, isVerified]
          properties:
            id: { type: string }
            kind: { type: string, enum: [customer, companion] }
            name: { type: string }
            role: { type: string }
            initials: { type: string }
            isOnline: { type: boolean }
            isVerified: { type: boolean }
            availability: { type: string }
            responseTime: { type: string }
        lastMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChatMessage"
        unreadCount: { type: integer, minimum: 0 }
        messageNotificationsMuted:
          type: boolean
          description: The authenticated viewer's own mute state only; another participant's state is never returned.
        conversationBlockedByYou:
          type: boolean
          description: The authenticated viewer's own active block state only; it is never a signal about the other participant.
        messageHistoryAvailable:
          type: boolean
          description: False only when a current privacy boundary hides ordinary chat history; closed order windows remain readable.
        messageInteractionAvailable:
          type: boolean
          description: True only during a paid order's configured communication window and when no privacy boundary is active.
        updatedAt: { type: string, format: date-time }
    ChatRestriction:
      type: object
      required: [id, reason, endsAt]
      properties:
        id: { type: string }
        reason: { type: string }
        endsAt: { type: string, format: date-time }
    DataRightsRequestInput:
      type: object
      additionalProperties: false
      required: [type, description]
      properties:
        type:
          type: string
          enum: [access, export, correction, deletion]
        description:
          type: string
          minLength: 5
          maxLength: 500
          description: A low-sensitivity scope statement; identity numbers, bank-card details, passwords, verification codes, and credentials are rejected.
    PublicSupportInfo:
      type: object
      additionalProperties: false
      required:
        - operatorName
        - channel
        - email
        - phone
        - serviceHours
        - expectedFirstResponseHours
        - statusUrl
        - authenticatedTicketPath
        - ticketAccessRequiresLogin
        - emergencyBoundary
      properties:
        operatorName: { type: string }
        channel: { type: string }
        email: { type: string }
        phone: { type: string }
        serviceHours: { type: string }
        expectedFirstResponseHours: { type: integer, minimum: 1 }
        statusUrl:
          type: string
          format: uri
          nullable: true
        authenticatedTicketPath:
          type: string
          enum: [/support/tickets]
        ticketAccessRequiresLogin: { type: boolean, enum: [true] }
        emergencyBoundary: { type: string }
    InvoiceRequestInput:
      type: object
      additionalProperties: false
      required: [orderId, invoiceTitle]
      properties:
        orderId: { type: string, format: uuid }
        invoiceTitle:
          type: string
          minLength: 2
          maxLength: 100
          description: Invoice title only. Tax, identity, bank, account, and credential literals are rejected.
    CustomerAdultEligibilityMethod:
      type: string
      enum: [externalProvider, governmentNetworkIdentity, secureManualReview]
    CustomerAdultEligibilityRecordedStatus:
      type: string
      enum: [pending, adult, ineligible]
    CustomerAdultEligibilitySubmissionInput:
      type: object
      additionalProperties: false
      required: [verificationMethod, evidenceReference, evidenceProcessingConfirmed]
      properties:
        verificationMethod:
          $ref: "#/components/schemas/CustomerAdultEligibilityMethod"
        evidenceReference:
          type: string
          minLength: 7
          maxLength: 160
          pattern: "^(?!.*[0-9]{10,})[A-Za-z][A-Za-z0-9._-]{1,31}:[A-Za-z0-9][A-Za-z0-9._:/-]{4,127}$"
          writeOnly: true
          description: Approved provider or controlled-vault opaque reference only. Never an identity number, document image, document contents, URL with credentials, or free-form evidence.
        evidenceProcessingConfirmed:
          type: boolean
          enum: [true]
          description: Explicit confirmation that evidence was processed through an approved external or controlled channel.
    CustomerAdultEligibilityRecovery:
      type: object
      additionalProperties: false
      required: [submissionPath, existingOrdersPath, accountRightsRemainAvailable, unpaidOrderCancellationRemainsAvailable, paidUnfulfilledRefundRequestsRemainAvailable]
      properties:
        submissionPath: { type: string, enum: [/api/v1/me/adult-eligibility/submissions] }
        existingOrdersPath: { type: string, enum: [/api/v1/orders] }
        accountRightsRemainAvailable: { type: boolean, enum: [true] }
        unpaidOrderCancellationRemainsAvailable: { type: boolean, enum: [true] }
        paidUnfulfilledRefundRequestsRemainAvailable: { type: boolean, enum: [true] }
    CustomerAdultEligibilityStatus:
      type: object
      additionalProperties: false
      required: [currentAdult, status, recordedStatus, verificationMethod, evidenceReferenceMasked, submittedAt, verifiedAt, validUntil, reviewReason, canSubmit, recovery]
      properties:
        currentAdult: { type: boolean }
        status:
          type: string
          enum: [notSubmitted, pending, adult, expired, ineligible]
          description: Derived current state; an expired recorded adult decision is returned as expired.
        recordedStatus:
          type: string
          enum: [pending, adult, ineligible]
          nullable: true
        verificationMethod:
          type: string
          enum: [externalProvider, governmentNetworkIdentity, secureManualReview]
          nullable: true
        evidenceReferenceMasked:
          type: string
          nullable: true
          maxLength: 41
          description: User-visible prefix plus only the last four opaque-reference characters. The controlled reference is never exposed here.
          example: "external:••••9XQ2"
        submittedAt: { type: string, format: date-time, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        reviewReason:
          type: string
          nullable: true
          maxLength: 500
          description: Sensitive-data-free decision rationale.
        canSubmit: { type: boolean }
        recovery:
          $ref: "#/components/schemas/CustomerAdultEligibilityRecovery"
    CustomerAdultEligibilityStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/CustomerAdultEligibilityStatus"
    CustomerAdultEligibilityAdminSubject:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, role, accountStatus, displayName]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, companion] }
        accountStatus: { type: string, enum: [active, restricted, banned] }
        displayName: { type: string, nullable: true }
    CustomerAdultEligibilityAdminReviewer:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
    CustomerAdultEligibilityAdminItem:
      type: object
      additionalProperties: false
      required: [id, userId, status, verificationMethod, evidenceReference, subject, submittedById, submittedAt, reviewedBy, verifiedAt, validUntil, reviewReason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/CustomerAdultEligibilityRecordedStatus"
        verificationMethod:
          $ref: "#/components/schemas/CustomerAdultEligibilityMethod"
        evidenceReference:
          type: string
          minLength: 7
          maxLength: 160
          pattern: "^(?!.*[0-9]{10,})[A-Za-z][A-Za-z0-9._-]{1,31}:[A-Za-z0-9][A-Za-z0-9._:/-]{4,127}$"
          readOnly: true
          description: Controlled opaque evidence reference visible only to authenticated supply/admin reviewers; never raw identity data or document contents.
        subject:
          $ref: "#/components/schemas/CustomerAdultEligibilityAdminSubject"
        submittedById: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        reviewedBy:
          $ref: "#/components/schemas/CustomerAdultEligibilityAdminReviewer"
        verifiedAt: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        reviewReason: { type: string, nullable: true, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerAdultEligibilityAdminListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [items, pagination]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/CustomerAdultEligibilityAdminItem"
                pagination:
                  $ref: "#/components/schemas/BoundedPagination"
    CustomerAdultEligibilityAdminItemEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/CustomerAdultEligibilityAdminItem"
    MarkCustomerAdultInput:
      type: object
      additionalProperties: false
      required: [validUntil, reason]
      properties:
        validUntil:
          type: string
          format: date-time
          description: Must be in the future and no more than 366 days after the review transaction.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Sensitive-data-free operational rationale; identity and payment numbers are rejected.
    MarkCustomerIneligibleInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Sensitive-data-free operational rationale; identity and payment numbers are rejected.
    IdentityVerificationSubmission:
      type: object
      additionalProperties: false
      required: [isVerified, reason, evidenceReference]
      properties:
        isVerified:
          type: boolean
          description: Desired state; the submission itself does not apply it.
