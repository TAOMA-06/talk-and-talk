          type: string
          nullable: true
          description: Controlled originating-record reference, never raw evidence.
        evidenceReference:
          type: string
          nullable: true
          description: Controlled private evidence-vault reference, never the evidence body.
        evidenceDigest:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Server-derived SHA-256 digest of the normalized action metadata and controlled references; it is not a digest supplied by the administrator.
        anonymizedAt:
          type: string
          format: date-time
          nullable: true
          description: Set only when retention expiry irreversibly clears all four evidence snapshot fields.
