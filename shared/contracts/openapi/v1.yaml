  /admin/commercial/payment-reconciliation/merchant-imports:
    get:
      tags: [admin, payments, commercial]
      summary: List immutable historical merchant-platform bill import proposals
      description: Finance/admin only. The import path is limited to official single-day exports older than the signed API 90-day window and no older than the merchant platform five-year history window. Raw statement content is never returned.
      operationId: adminListWeChatMerchantBillImports
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Bounded proposal metadata; raw statement content is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatMerchantBillImportListEnvelope"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [admin, payments, commercial]
      summary: Propose a small historical merchant-platform statement using JSON
      description: Finance/admin only. The bill date must be older than the signed API 90-day window and within the merchant platform five-year history window. For files approaching 20 MiB use the route-scoped text upload. The official export must contain exactly one Shanghai bill date; 31-day merged exports are rejected. Raw content is parsed request-locally and never persisted or audited.
      operationId: adminSubmitWeChatMerchantBillImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWeChatMerchantBillImportInput"
      responses:
        "200":
          description: Pending immutable import proposal awaiting an independent reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatMerchantBillImportEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/merchant-imports/text:
    post:
      tags: [admin, payments, commercial]
      summary: Propose a historical merchant-platform statement through a route-scoped 20 MiB text upload
      description: Accepts one UTF-8 official single-day CSV export older than the signed API 90-day window and within the merchant platform five-year history window as text/plain or text/csv. The global JSON body limit is not enlarged. Content is never copied into audit logs, APM metadata, or persistence; only SHA-256, normalized facts, size, date range and the private evidence reference survive.
      operationId: adminSubmitWeChatMerchantBillTextImport
      security:
        - bearerAuth: []
      parameters:
        - name: x-wechat-bill-date
          in: header
          required: true
          schema: { type: string, format: date }
        - name: x-wechat-bill-kind
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/WeChatDailyBillKind"
        - name: x-content-sha256
          in: header
          required: true
          schema: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        - name: x-evidence-reference
          in: header
          required: true
          schema: { type: string, minLength: 6, maxLength: 160, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{5,159}$" }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, minLength: 1, maxLength: 20971520 }
          text/csv:
            schema: { type: string, minLength: 1, maxLength: 20971520 }
      responses:
        "200":
          description: Pending immutable import proposal awaiting independent review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeChatMerchantBillImportEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-reconciliation/merchant-imports/{id}/reviews:
    post:
      tags: [admin, payments, commercial]
      summary: Independently approve or reject a historical statement import
      description: Reviewer must differ from importer. Approval locks the proposal against concurrent row append, verifies the normalized digest again, creates the immutable run, reconciles, and only then transitions the proposal.
      operationId: adminReviewWeChatMerchantBillImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
