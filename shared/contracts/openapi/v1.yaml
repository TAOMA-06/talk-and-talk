        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companionId, themeId, durationMinutes, scheduledAt]
              properties:
                companionId: { type: string }
                serviceOfferingId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Required in commercial release mode. It must identify a current active offering belonging to companionId; its server-side price and duration are authoritative and frozen on the order. Optional only for controlled internal legacy compatibility.
                availabilityWindowId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Required in commercial release mode. It must be the structured availability window returned by listCompanionAvailability; scheduledAt must be a 30-minute candidate fully contained by this active window. The server records a capacity snapshot and rechecks it at confirmation and prepay. Optional only for controlled internal legacy compatibility.
                themeId: { type: string }
                durationMinutes:
                  type: integer
                  minimum: 30
                  maximum: 240
                  description: Must exactly match the selected service offering's duration when serviceOfferingId is supplied.
                scheduledAt: { type: string, format: date-time, description: Must fall within the server-configured commercial booking horizon. With availabilityWindowId it is the selected candidate start time and must use a 30-minute boundary. }
                clientRequestId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  description: Required in commercial release mode and stable across retries so one user action creates at most one order.
                recommendationImpressionId: { type: string, format: uuid, description: Optional card impression attribution, valid for 24 hours. }
      responses:
        "400":
          description: Invalid duration or schedule outside the allowed booking window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "200":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: Per-user or companion intake limit reached, an availability candidate/window is no longer valid or full, or an idempotency key was reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Commercial intake requires clientRequestId, serviceOfferingId, and availabilityWindowId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Order intake is paused or the controlled global open-order capacity is reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
