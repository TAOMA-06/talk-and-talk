        "200":
          description: Reply accepted by the provider or the idempotent prior result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /admin/commercial/payment-disputes/{id}/completions:
    post:
      tags: [admin, payments, support]
      summary: Submit an idempotent complaint completion to WeChat Pay
      description: Requires authoritative PROCESSING state, at least one merchant response, no unread customer response, and no active WeChat platform service. Funding release is separately blocked by any other active dispute or refund.
