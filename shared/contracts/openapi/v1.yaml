      summary: Request placement of a disposal-blocking legal hold
      description: Admin-only first-person action. The request snapshots the current partially erased phase/cursor/count, clears worker scheduling and leases atomically, and requires another active administrator to approve. A terminal retention record or an active/pending hold is rejected.
