        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisionReference, decisionReasonCode]
              properties:
                decisionReference: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{5,159}$" }
                decisionReasonCode: { type: string, enum: [AUTHORITY_NOT_VERIFIED, DUPLICATE_OR_SUPERSEDED, POLICY_SCOPE_MISMATCH, REQUEST_EVIDENCE_INVALID, RETENTION_RECORD_MISMATCH] }
      responses:
        "200":
          description: Terminal rejection and unchanged or resumed disposal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRetentionLegalHoldMutationEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
