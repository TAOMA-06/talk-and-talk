      tags: [admin, commercial]
      summary: Aggregate operational blockers, including legal approval of account-deletion retention and overdue account appeals, that must be clear before commercial traffic continues
      description: accountDeletionRetentionPolicyUnapproved is 1 unless the externally approved retention-policy flag and its non-secret approval reference are both configured. accountDeletionRetentionApprovalBacklog counts immutable retention-ledger rows that have not yet been promoted from pendingLegalApproval, so configuration alone cannot clear the gate. Pending account appeals whose snapshotted reviewDueAt is already past are counted separately. Each blocker independently forces attentionRequired; approval references, resolved appeal history, and queue pagination are not exposed by this aggregate.
      operationId: adminCommercialReadiness
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current commercial operational gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/commercial/availability-reminders/readiness:
    get:
      tags: [admin, commercial, favorites]
      summary: Read durable availability-reminder fanout and handoff-reservation readiness
      description: Operations and admin only. Exact counts cover every incomplete or terminally failed window-version fanout job and every handoff not yet converted into the durable attempt consumed by delivery. The bounded failed-job sample is explicitly marked when truncated. A nonempty backlog is never reported as clear. No result implies a notification or provider delivery.
      operationId: adminAvailabilityReminderFanoutReadiness
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current fanout/reservation worker configuration, exact backlog, and bounded failure sample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityReminderFanoutReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/commercial/availability-reminders/fanout-jobs/{id}/retry:
    post:
      tags: [admin, commercial, favorites]
      summary: Schedule an audited retry for one terminally failed fanout job
      description: Operations and admin only. The retry preserves the stable audience cutoff and committed keyset cursor, clears only terminal failure state, and does not create or claim any delivery.
      operationId: adminRetryAvailabilityReminderFanoutJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Failed job returned to retryScheduled state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityReminderFanoutRetryEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
