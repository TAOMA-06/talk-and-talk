      description: Operations and admin only. The service revalidates the exact candidate state; it never consumes a subscription grant or calls WeChat at this stage.
      operationId: adminRetryAvailabilityReminderPreparation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Preparation record safely returned to retryable work, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/commercial/availability-reminders/reservation-handoffs/{id}/retry:
    post:
      tags: [admin, commercial, favorites]
      summary: Schedule an audited retry for one grant-reservation handoff failure
      description: Operations and admin only. The service revalidates the handoff and one-time authorization state before allowing another reservation attempt.
      operationId: adminRetryAvailabilityReminderReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Reservation handoff safely returned to retryable work, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/commercial/availability-reminders/delivery-attempts/{id}/retry:
    post:
      tags: [admin, commercial, favorites]
      summary: Request an audited retry for one delivery attempt that failed before send
      description: Operations and admin only. Only a service-confirmed pre-send failure can return to retryable work. Rejected or uncertain remote outcomes fail closed and are never automatically resent.
      operationId: adminRetryAvailabilityReminderDelivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Eligible pre-send failure returned to retryable work, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
