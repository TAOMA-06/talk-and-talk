        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The reported message anchor is unavailable or no longer belongs to the case conversation; adverse action must remain disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /review/cases/{id}/claim:
