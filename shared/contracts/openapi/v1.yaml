components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Envelope error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        meta:
          $ref: "#/components/schemas/Meta"
    PublicCompanion:
      type: object
      required: [id, name, role, initials, tags, rating, reviewCount, pricePerHalfHour, isOnline, isVerified, bio, availableTimes, languages, specialties, topicIds, completedOrders, responseTime, distanceKm, availability, cityDistrict, isPublished, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        initials: { type: string }
        tags:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewCount: { type: integer, minimum: 0 }
        pricePerHalfHour: { type: integer, minimum: 0 }
        isOnline: { type: boolean }
        isVerified: { type: boolean }
        bio: { type: string }
        availableTimes:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        specialties:
          type: array
          items: { type: string }
        topicIds:
          type: array
          items: { type: string }
        completedOrders: { type: integer, minimum: 0 }
        responseTime: { type: string }
        distanceKm: { type: number, minimum: 0 }
        availability: { type: string }
        cityDistrict: { type: string }
        catalog:
          type: object
          description: Current seven-day sellability summary. Public discovery and recommendation items are returned only when sellable is true; private recall surfaces may omit this field.
          required: [sellable, startingPriceCents, startingDurationMinutes, currency, deliveryModes, nextAvailableAt]
          properties:
            sellable: { type: boolean }
            startingPriceCents: { type: integer, minimum: 1, nullable: true }
            startingDurationMinutes: { type: integer, minimum: 30, nullable: true }
            currency: { type: string, nullable: true }
            deliveryModes:
              type: array
              items: { type: string, enum: [text, voice] }
            nextAvailableAt: { type: string, format: date-time, nullable: true }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCompanionAdminInput:
      type: object
      additionalProperties: false
      description: Trust metrics (rating, reviewCount, completedOrders, and responseTime) are server-derived and are intentionally not writable.
      required: [name, role, initials, tags, pricePerHalfHour, isOnline, isVerified, bio, availableTimes, languages, specialties, distanceKm, availability, cityDistrict]
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        name: { type: string }
        role: { type: string }
        initials: { type: string }
        tags:
          type: array
          minItems: 1
          items: { type: string }
        pricePerHalfHour: { type: integer, minimum: 1, description: Legacy compatibility field; new commercial orders use service offering priceCents. }
        isOnline: { type: boolean }
        isVerified: { type: boolean }
        bio: { type: string }
        availableTimes:
          type: array
          minItems: 1
          items: { type: string }
        languages:
          type: array
          minItems: 1
          items: { type: string }
        specialties:
          type: array
          minItems: 1
          items: { type: string }
        topicIds:
          type: array
          items: { type: string }
        distanceKm: { type: number, minimum: 0 }
        availability: { type: string, enum: [online, available, busy] }
        cityDistrict: { type: string }
        isPublished: { type: boolean, enum: [false], default: false }
    UpdateCompanionAdminInput:
      type: object
      additionalProperties: false
      description: Public trust metrics are read-only. Publishing remains a separate guarded operation.
      properties:
        ownerUserId: { type: string }
        name: { type: string }
        role: { type: string }
        initials: { type: string }
        tags:
          type: array
          minItems: 1
          items: { type: string }
        pricePerHalfHour: { type: integer, minimum: 1, description: Legacy compatibility field; it is not a current sellable SKU price. }
        isOnline: { type: boolean }
        isVerified: { type: boolean }
        bio: { type: string }
        availableTimes:
          type: array
          minItems: 1
          items: { type: string }
        languages:
          type: array
          minItems: 1
          items: { type: string }
        specialties:
          type: array
          minItems: 1
          items: { type: string }
        topicIds:
          type: array
          items: { type: string }
        distanceKm: { type: number, minimum: 0 }
        availability: { type: string, enum: [online, available, busy] }
        cityDistrict: { type: string }
        isPublished: { type: boolean }
    FavoriteCompanion:
      allOf:
        - $ref: "#/components/schemas/PublicCompanion"
        - type: object
          required: [availabilityReminderEnabled, availabilityReminderUpdatedAt, availabilityReminderMinimumIntervalHours]
          properties:
            availabilityReminderEnabled:
              type: boolean
              description: Customer-only armed preference, not a delivery result or a promise that a notification has been sent.
            availabilityReminderUpdatedAt:
              type: string
              format: date-time
              nullable: true
            availabilityReminderMinimumIntervalHours:
              type: integer
              minimum: 24
              description: A future delivery must not contact this customer about this same companion more often than this interval.
    FavoriteAvailabilityReminderPreference:
      type: object
      required: [companionId, enabled, updatedAt, minimumIntervalHours]
      properties:
        companionId: { type: string }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        minimumIntervalHours: { type: integer, minimum: 24 }
    CompanionServiceOffering:
      type: object
      required: [id, code, title, deliveryMode, durationMinutes, priceCents, currency, topicIds]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        deliveryMode: { type: string, enum: [text, voice] }
        durationMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, enum: [CNY] }
        topicIds:
          type: array
          items: { type: string }
    OwnCompanionServiceOffering:
      allOf:
        - $ref: "#/components/schemas/CompanionServiceOffering"
        - type: object
          required: [isActive, sortOrder, createdAt, updatedAt]
          properties:
            isActive: { type: boolean }
            sortOrder: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    OwnCompanionAvailabilityWindow:
      type: object
      required: [id, startsAt, endsAt, capacity, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 10 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnCompanionRecurringAvailabilityRule:
      type: object
      required: [id, weekday, startsAtMinute, endsAtMinute, capacity, timezone, isActive, createdAt, updatedAt]
      description: Private owner scheduling template. It is not a public availability window or a promise of bookable capacity.
      properties:
        id: { type: string }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startsAtMinute: { type: integer, minimum: 0, maximum: 1410, multipleOf: 30 }
        endsAtMinute: { type: integer, minimum: 30, maximum: 1440, multipleOf: 30 }
        capacity: { type: integer, minimum: 1, maximum: 10 }
        timezone: { type: string, enum: [Asia/Shanghai] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnCompanionAvailabilityBlackout:
      type: object
      required: [id, startsAt, endsAt, timezone, isActive, createdAt, updatedAt]
      description: Private owner scheduling exception. It is not a public cancellation, notification, or change to an existing booking.
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, enum: [Asia/Shanghai] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanionTodayServiceEntry:
      type: object
      required: [id, scheduledAt, durationMinutes, status, serviceTitle]
      description: Minimal owner-only workbench item; it intentionally contains no customer, conversation, refund, settlement, payment, or internal order fields.
      properties:
        id: { type: string }
        scheduledAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, paying, paid, inService, completed] }
        serviceTitle: { type: string }
    CompanionTodayServiceSchedule:
      type: object
      required: [date, timezone, pendingConfirmationCount, items]
      description: Read-only list for one Asia/Shanghai calendar day. The date boundary is computed by the server from appointment start times.
      properties:
        date: { type: string, format: date, example: "2026-07-21" }
        timezone: { type: string, enum: [Asia/Shanghai] }
        pendingConfirmationCount:
          type: integer
          minimum: 0
          description: Caller-owned pending orders that still await companion confirmation; the count does not create a reminder or change an order.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanionTodayServiceEntry"
    OrderRescheduleRequest:
      type: object
      required: [id, requestedByRole, originalScheduledAt, requestedScheduledAt, requestedAvailabilitySnapshot, status, expiresAt, respondedAt]
      properties:
        id: { type: string }
        requestedByRole: { type: string, enum: [customer, companion] }
        originalScheduledAt: { type: string, format: date-time }
        requestedScheduledAt: { type: string, format: date-time }
        requestedAvailabilitySnapshot:
          type: object
          nullable: true
          required: [availabilityWindowId, startsAt, endsAt, capacity]
          properties:
            availabilityWindowId: { type: string }
            startsAt: { type: string, format: date-time, nullable: true }
            endsAt: { type: string, format: date-time, nullable: true }
            capacity: { type: integer, nullable: true, minimum: 1 }
        status: { type: string, enum: [pending, accepted, rejected, expired, cancelled] }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
    OrderTimelineEvent:
      type: object
      required: [id, type, actorRole, occurredAt, rescheduleRequest]
      properties:
        id: { type: string }
        type: { type: string, enum: [orderCreated, rescheduleRequested, rescheduleAccepted, rescheduleRejected, rescheduleExpired, rescheduleCancelled] }
        actorRole: { type: string, enum: [customer, companion, system] }
        occurredAt: { type: string, format: date-time }
        rescheduleRequest:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OrderRescheduleRequest"
    VoiceRoomAccess:
      type: object
      required: [provider, sdkAppId, roomId, userId, userSig, privateMapKey, participantRole, expiresAt, serviceEndsAt, participant]
      description: Short-lived connection material. It is valid only for the caller, room and service window returned by the server; clients must keep it in memory only.
      properties:
        provider: { type: string, enum: [trtc] }
        sdkAppId: { type: integer, minimum: 1 }
        roomId: { type: string, maxLength: 64, description: Opaque provider room identifier derived by the server. }
        userId: { type: string, maxLength: 32, description: Opaque provider participant identifier; not the platform account ID. }
        userSig: { type: string, minLength: 1, description: Short-lived provider credential; never persist or log. }
        privateMapKey: { type: string, minLength: 1, description: Provider room restriction for this participant; never persist or log. }
        participantRole: { type: string, enum: [customer, companion] }
        expiresAt: { type: string, format: date-time }
        serviceEndsAt: { type: string, format: date-time }
        participant:
          type: object
          required: [name, initials]
          properties:
            name: { type: string, maxLength: 80 }
            initials: { type: string, maxLength: 16 }
    CompanionAvailabilityCandidate:
      type: object
      required: [id, availabilityWindowId, startsAt, endsAt, capacity, reservedCount, availableCapacity]
      properties:
        id: { type: string, description: Candidate identifier derived from its availability window and start time. }
        availabilityWindowId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        reservedCount: { type: integer, minimum: 0 }
        availableCapacity: { type: integer, minimum: 0 }
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string }
            role:
              type: string
              enum: [user, companion, moderator, admin]
            profile:
              type: object
              properties:
                displayName: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                gender: { type: string, nullable: true }
                isVerified: { type: boolean }
                safetyScore: { type: integer }
    MediaAttachment:
      type: object
      required: [id, kind, status, mimeType, sizeBytes]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, audio] }
        status: { type: string, enum: [reserved, uploaded, scanning, approved, blocked, failed, expired] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: integer, nullable: true }
        url: { type: string, nullable: true, description: Short-lived authorized read URL only when viewer is permitted }
        expiresAt: { type: string, format: date-time, nullable: true }
    ChatMessage:
      type: object
      required: [id, senderId, content, type, moderationStatus, visibility, attachments, timestamp]
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        senderName: { type: string, nullable: true }
        content: { type: string }
        type: { type: string, enum: [text, image, audio, system, safety] }
        moderationStatus: { type: string, enum: [queued, pendingReview, published, blocked, removed] }
        visibility: { type: string, enum: [participants, senderOnly, staffOnly] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/MediaAttachment" }
        timestamp: { type: string, format: date-time }
    ConversationSummary:
      type: object
      required: [id, companionId, viewerRole, participant, lastMessage, unreadCount, messageNotificationsMuted, conversationBlockedByYou, messageHistoryAvailable, messageInteractionAvailable, updatedAt]
      properties:
        id:
          type: string
          description: The caller's authorized chat route identifier; it is a public companion id for a customer and an internal conversation id for the companion owner.
        companionId: { type: string }
        viewerRole: { type: string, enum: [customer, companion] }
        participant:
          type: object
          required: [id, name, role, initials, isOnline, isVerified]
          properties:
            id: { type: string }
            kind: { type: string, enum: [customer, companion] }
            name: { type: string }
            role: { type: string }
            initials: { type: string }
            isOnline: { type: boolean }
            isVerified: { type: boolean }
            availability: { type: string }
            responseTime: { type: string }
        lastMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChatMessage"
        unreadCount: { type: integer, minimum: 0 }
        messageNotificationsMuted:
          type: boolean
          description: The authenticated viewer's own mute state only; another participant's state is never returned.
        conversationBlockedByYou:
          type: boolean
          description: The authenticated viewer's own active block state only; it is never a signal about the other participant.
        messageHistoryAvailable:
          type: boolean
          description: False only when a current privacy boundary hides ordinary chat history; closed order windows remain readable.
        messageInteractionAvailable:
          type: boolean
          description: True only during a paid order's configured communication window and when no privacy boundary is active.
        updatedAt: { type: string, format: date-time }
    ChatRestriction:
      type: object
      required: [id, reason, endsAt]
      properties:
        id: { type: string }
        reason: { type: string }
        endsAt: { type: string, format: date-time }
