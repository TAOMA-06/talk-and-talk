openapi: 3.0.3
info:
  title: Talk&Talk API
  version: 0.1.0
  description: |
    Frozen public contract for `/api/v1`.
    All JSON responses use a uniform envelope (see components.schemas.SuccessEnvelope / ErrorEnvelope).
    Breaking changes require `/api/v2` or coordinated release notes.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-staging.talkandtalk.app/api/v1
    description: Staging
  - url: https://api.talkandtalk.app/api/v1
    description: Production
tags:
  - name: health
  - name: crisis
  - name: metrics
  - name: auth
  - name: users
  - name: companions
  - name: orders
  - name: payments
  - name: conversations
  - name: moderation
  - name: notifications
  - name: legal
  - name: support
  - name: safety
  - name: commercial
  - name: community
  - name: reviews
  - name: favorites
  - name: recently-viewed
  - name: admin
  - name: review
paths:
  /legal/terms:
    get:
      tags: [legal]
      summary: Current immutable terms snapshot
      operationId: getCurrentTerms
      security: []
      responses:
        "200":
          description: HTML terms document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/privacy:
    get:
      tags: [legal]
      summary: Current immutable privacy-policy snapshot
      description: The current version states that user-authored content remains inside local rules and authorized human review and is not transmitted to DeepSeek or another external generative-AI service. Any future provider requires a new immutable legal version and applicable external approval; code does not replace legal review.
      operationId: getCurrentPrivacyPolicy
      security: []
      responses:
        "200":
          description: HTML privacy-policy document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/platform-rules:
    get:
      tags: [legal]
      summary: Current immutable platform-rules snapshot
      operationId: getCurrentPlatformRules
      security: []
      responses:
        "200":
          description: HTML platform-rules document; serving it publishes an immutable versioned snapshot
          content:
            text/html:
              schema: { type: string }
  /legal/{document}/versions/{version}:
    get:
      tags: [legal]
      summary: Retrieve a previously published immutable legal-document version
      operationId: getLegalDocumentVersion
      security: []
      parameters:
        - name: document
          in: path
          required: true
          schema: { type: string, enum: [terms, privacy, platform-rules] }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Archived HTML legal document
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags: [health]
      summary: Process liveness (no dependency probes)
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is up (status ok). Dependency health is never reflected here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /health/ready:
    get:
      tags: [health]
      summary: Dependency readiness (authenticated outside development)
      operationId: getHealthReady
      description: >
        Returns database and redis dependency status. Outside development, requires
        `Authorization: Bearer <METRICS_TOKEN>` (token length ≥ 32). Prefer this for
        orchestration readiness probes; keep public `/health` for liveness only.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Bearer METRICS_TOKEN (required when APP_ENV is not development)
          schema:
            type: string
      responses:
        "200":
          description: Dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Missing or invalid METRICS_TOKEN bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Dependencies degraded, or METRICS_TOKEN not configured outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /crisis/resources:
    get:
      tags: [crisis, safety]
      summary: Official crisis-resource catalog with an always-available 110/120 baseline
      description: Public and consent-independent. Before catalog approval it returns only the dated 110/120 emergency baseline and explicitly disclaims complete regional coverage.
      operationId: getCrisisResources
      security: []
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
            pattern: "^CN(-[0-9]{2})?$"
            default: CN
      responses:
        "200":
          description: Dated official resource catalog; platform dispatch and ordinary-support disclaimers are mandatory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisResourceCatalogEnvelope"
        "400": { $ref: "#/components/responses/Error" }
  /crisis/readiness:
    get:
      tags: [crisis, health]
      summary: Crisis-resource commercial release readiness
      description: Does not expose the approval reference itself. A missing approval flag or reference is a release No-Go while the public 110/120 resource endpoint remains available.
      operationId: getCrisisReadiness
      security: []
      responses:
        "200":
          description: Crisis catalog is approved for release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisReadinessEnvelope"
        "503":
          description: Crisis catalog approval is a commercial release No-Go
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisReadinessEnvelope"
  /crisis/interventions:
    post:
      tags: [crisis, safety]
      summary: Create or reuse the caller's pending emergency-resource routing fact
      description: Accepts only enumerated source, risk code and region. Raw user text, message content, message identifiers and free-form narrative are forbidden.
      operationId: createCrisisIntervention
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrisisInterventionInput"
      responses:
        "201":
          description: New or existing pending intervention owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisInterventionEnvelope"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /crisis/interventions/active:
    get:
      tags: [crisis, safety]
      summary: Read the caller's active pending intervention
      operationId: getActiveCrisisIntervention
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner-scoped active intervention or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCrisisInterventionEnvelope"
        "401": { $ref: "#/components/responses/Error" }
  /crisis/interventions/{id}:
    get:
      tags: [crisis, safety]
      summary: Read one caller-owned intervention
      operationId: getCrisisIntervention
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Owner-scoped intervention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisInterventionEnvelope"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /crisis/interventions/{id}/resource-view-completions:
    post:
      tags: [crisis, safety]
      summary: Idempotently mark caller-owned emergency resources viewed
      operationId: completeCrisisResourceView
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Completed owner-scoped intervention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisInterventionEnvelope"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics text
      description: A dedicated METRICS_TOKEN bearer credential is mandatory in production and omitted only in non-production environments.
      operationId: getMetrics
      security:
        - metricsBearerAuth: []
        - {}
      responses:
        "200":
          description: Prometheus exposition format (text/plain)
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /auth/sms/send-code:
    post:
      tags: [auth]
      summary: Send SMS verification code
      operationId: sendSmsCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "13800138000"
      responses:
        "201":
          description: Code sent (mock logs code in development/staging)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresInSeconds:
                            type: integer
        "429":
          $ref: "#/components/responses/Error"
  /auth/phone/login:
    post:
      tags: [auth]
      summary: Phone + code login
      operationId: phoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "201":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/LoginIdentityUnavailable"
        "503":
          $ref: "#/components/responses/Error"
  /auth/apple:
    post:
      tags: [auth]
      summary: Apple Sign-In
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
      responses:
        "201":
          description: Token pair + user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/LoginIdentityUnavailable"
        "503":
          $ref: "#/components/responses/Error"
  /auth/wechat/mini-program:
    post:
      tags: [auth]
      summary: Sign in with WeChat Mini Program code
      operationId: wechatMiniProgramLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Short-lived credential returned by wx.login
      responses:
        "201":
          description: Token pair + new or existing WeChat user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/LoginIdentityUnavailable"
        "503":
          $ref: "#/components/responses/Error"
  /auth/wechat/mini-program/status:
    get:
      tags: [auth]
      summary: Check whether server-side Mini Program credentials are configured
      operationId: wechatMiniProgramStatus
      security: []
      responses:
        "200":
          description: Configuration readiness without credential values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [module, status, configured]
                        properties:
                          module: { type: string, enum: [wechatMiniProgram] }
                          status: { type: string, enum: [configured, unconfigured] }
                          configured: { type: boolean }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access/refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "201":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "201":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me:
    get:
      tags: [users]
      summary: Current user (legacy path)
      operationId: getUsersMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /users/me/legal-consents:
    get:
      tags: [users]
      summary: Read the caller's latest legal-consent receipt
      operationId: getLegalConsent
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: version
          schema: { type: string }
      responses:
        "200":
          description: Latest receipt and whether it matches the current published documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [users]
      summary: Record consent to the current privacy policy and terms
      operationId: recordLegalConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - privacyAccepted
                - termsAccepted
                - adultConfirmed
                - acceptedAt
                - privacyUrl
                - termsUrl
                - source
              properties:
                version: { type: string }
                privacyAccepted: { type: boolean, enum: [true] }
                termsAccepted: { type: boolean, enum: [true] }
                adultConfirmed: { type: boolean, enum: [true] }
                acceptedAt: { type: string, format: date-time }
                privacyUrl: { type: string, format: uri }
                termsUrl: { type: string, format: uri }
                source: { type: string, enum: [wechatMiniProgram, web] }
      responses:
        "201":
          description: Consent receipt recorded or existing current receipt returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
  /users/me/legal-consents/current:
    delete:
      tags: [users]
      summary: Withdraw the caller's current legal consent
      operationId: withdrawLegalConsent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Withdrawal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me:
    get:
      tags: [users]
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [users]
      summary: Update profile (displayName, gender, etc.)
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
                gender:
                  type: string
                  enum: [female, male]
                  nullable: true
                  description: Send null to clear a previously stored value. "Prefer not to say" is represented by null, never a fabricated third gender value.
                age: { type: integer, minimum: 18, maximum: 120 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Display name failed public-profile moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/adult-eligibility:
    get:
      tags: [users, safety]
      summary: Get the caller's authoritative adult-eligibility status
      description: Available before current legal consent so the caller can inspect and recover eligibility. The response exposes only a masked evidence reference; raw identity data, document images and the controlled evidence reference are never returned on this user route.
      operationId: getMyAdultEligibility
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status, expiry and recovery paths for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAdultEligibilityStatusEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /me/adult-eligibility/submissions:
    post:
      tags: [users, safety]
      summary: Submit an opaque adult-eligibility evidence reference for review
      description: Available before current legal consent. Accepts only an approved provider or controlled-vault reference plus explicit processing confirmation; identity numbers, document images and free-form evidence are rejected. Staff accounts cannot enter the customer workflow.
      operationId: submitMyAdultEligibility
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAdultEligibilitySubmissionInput"
      responses:
        "200":
          description: Pending review status, or the authoritative caller status returned after submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAdultEligibilityStatusEnvelope"
        "400":
          description: Invalid method, confirmation, or non-opaque/sensitive evidence value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: The authenticated identity is not an eligible customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A review is already pending, a current adult decision exists, or the evidence reference is already bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/deletion-request:
    get:
      tags: [users]
      summary: Get the caller's latest account-deletion status and current SLA policy
      description: Returns the caller's latest request, including a cancelled outcome, or null when none exists. This rights-status route remains available without accepting the current legal documents.
      operationId: getMyDeletionRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest caller-owned deletion status and the current versioned deadline rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionStatusEnvelope"
    post:
      tags: [users]
      summary: Request account deletion
      description: Creates one idempotent active request with a persisted 15-weekday deadline. The published rule skips weekends only and does not exclude statutory holidays or apply adjusted working weekends.
      operationId: requestDeletion
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionSubmissionEnvelope"
  /me/deletion-request/cancel:
    post:
      tags: [users]
      summary: Cancel the caller's pending account-deletion request
      description: Idempotently cancels only the caller's latest pending request. Processing, completed and any other terminal states fail closed. Independent restrictions and bans remain unchanged, revoked sessions are never restored, and a companion's retired supply remains offline until commercial eligibility, adult status, agreement, offerings and availability are reviewed and republished.
      operationId: cancelMyDeletionRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending deletion cancelled, or the same cancelled outcome returned idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionCancellationEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The latest deletion request is no longer pending and cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/account-actions:
    get:
      tags: [users, safety]
      summary: List the caller's formal account restrictions, bans and appeals
      description: Available to restricted and banned ordinary consumers without requiring a current legal-consent receipt. Staff and companion accounts fail closed into their dedicated lifecycle workflows.
      operationId: listMyAccountActions
      security:
        - bearerAuth: []
      parameters:
        - name: actionId
          in: query
          description: Exact owner-scoped action ID used by notification cold-start recovery
          schema: { type: string, maxLength: 191 }
        - name: appealId
          in: query
          description: Exact owner-scoped appeal ID used by notification cold-start recovery
          schema: { type: string, maxLength: 191 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, upheld, overturned, dismissed] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Stable account status, action history and appeal states
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserAccountActionHistory"
        "403":
          $ref: "#/components/responses/Error"
  /me/account-actions/{id}/appeals:
    post:
      tags: [users, safety]
      summary: Appeal one active account restriction or ban
      description: Exactly one appeal may be submitted for an owned action within its 30-day window. Receipt starts a 72-hour independent-review SLA.
      operationId: appealMyAccountAction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statement]
              properties:
                statement:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        "201":
          description: Appeal accepted for independent review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserAccountAppeal"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/sessions:
    get:
      tags: [users, auth]
      summary: List the caller's active login sessions
      description: Returns only active, unexpired server-side sessions. The current flag is derived from the access token session id.
      operationId: listMyAccountSessions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Active login sessions with sanitized device labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    delete:
      tags: [users, auth]
      summary: Revoke every other active login session owned by the caller
      description: Keeps the access-token session used for this request and atomically revokes all other active refresh-token sessions.
      operationId: revokeMyOtherAccountSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Other sessions revoked; returns the number of sessions affected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /me/sessions/{id}:
    delete:
      tags: [users, auth]
      summary: Revoke one active login session owned by the caller
      description: Revocation invalidates both the refresh token and any session-bound access token for that session.
      operationId: revokeMyAccountSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /me/data-rights:
    get:
      tags: [users, privacy]
      summary: List the caller's data-rights requests
      operationId: listMyDataRightsRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [submitted, inReview, needsInformation, completed, rejected] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Data-rights request history and authoritative processing states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
    post:
      tags: [users, privacy]
      summary: Submit a data access, export, correction, or deletion request
      description: Submission acknowledges receipt only; it never claims that an export was generated or data was deleted.
      operationId: createMyDataRightsRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRightsRequestInput"
      responses:
        "201":
          description: Data-rights request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/data-rights/{id}/export:
    get:
      tags: [users, privacy]
      summary: Securely download an owned, completed personal-data export
      description: >-
        Proxies the completed artifact from the configured private evidence vault.
        The caller must own the export request; internal object references and
        provider credentials are never returned. Redirects, missing lengths,
        unsupported content types, oversized bodies, and length mismatches fail closed.
      operationId: downloadMyCompletedDataExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Personal-data export artifact
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="talk-and-talk-data-export-id.json"' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/json:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me/data-rights/{id}/follow-ups:
    post:
      tags: [users, privacy]
      summary: Add requested information to an owned data-rights request
      description: Accepted only while the request is in needsInformation. The platform question is snapshotted beside the append-only answer before the request returns to the unassigned queue.
      operationId: addMyDataRightsRequestFollowUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRightsFollowUpInput"
      responses:
        "201":
          description: Follow-up appended and request resubmitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/invoice-requests:
    get:
      tags: [users, payments]
      summary: List the caller's invoice requests
      operationId: listMyInvoiceRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [submitted, inReview, issued, rejected, voided, cancelled] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Invoice request history and authoritative issuance states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemsEnvelope"
    post:
      tags: [users, payments]
      summary: Request an invoice for one eligible paid order
      description: The service rechecks order ownership, authoritative successful payment, and refund state under the canonical order lock.
      operationId: createMyInvoiceRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequestInput"
      responses:
        "201":
          description: Invoice request submitted; this is not proof of issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/invoice-requests/eligible-orders:
    get:
      tags: [users, payments]
      summary: List the caller's orders that remain eligible for an invoice request
      description: Returns a bounded, authoritative candidate list. Eligibility is rechecked again under the canonical order lock when a request is submitted.
      operationId: listMyInvoiceEligibleOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Candidate paid orders with an authoritative eligible flag, ineligibility reason, and bounded pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCandidateOrdersEnvelope"
  /me/invoice-requests/{id}/cancel:
    post:
      tags: [users, payments]
      summary: Cancel the caller's submitted invoice request
      description: Only a request that finance has not taken into review can be cancelled. Cancellation is serialized with refund and invoice processing by the canonical order lock.
      operationId: cancelMyInvoiceRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Invoice request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /companions/status:
    get:
      tags: [companions]
      summary: Companions module status
      operationId: companionsStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /companions:
    get:
      tags: [companions]
      summary: List companions
      description: The default public catalog keeps its existing order. language and specialty are explicit exact-match facets evaluated only against the currently public, commercially eligible companion profile; they never inspect applications, KYC evidence, reviewer notes, conversations or behavioral inference. keyword is an explicitly submitted, short public-catalog query matched only against a companion's public name, role, service tags, and titles of current active service offerings; it is not persisted or used as a recommendation, marketing, companion-visible, or availability signal. sortBy is an explicit customer choice that switches the client to this public catalog rather than a personalized recommendation. soonestAvailable only considers current public profiles with a current structured candidate that has remaining capacity, then orders by the earliest candidate for the same matching active service in the next seven days, or inside availableWithinDays when that shorter window is selected. It does not reserve a time, expose a promise of availability, or use legacy free-text availability; detail and order creation recheck capacity. When keyword is matched through a service title together with topicId, deliveryMode, maxServicePriceCents, or availableWithinDays, those conditions must match the same current active service offering. availableWithinDays additionally requires a current structured availability candidate with remaining capacity for that same matching service; legacy free-text availability never qualifies. maxServicePriceCents is the total price for that one current service, not a historical order price or a duration-normalized estimate. Private preferences, chat, order body, bookmarks, recent views, companion-visible relationships, and marketing data are never inputs to this endpoint.
      operationId: listCompanions
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: language
          description: Exact 1–40-character communication language selected from a companion's qualified public profile.
          schema: { type: string, minLength: 1, maxLength: 40 }
        - in: query
          name: specialty
          description: Exact 1–40-character specialty or interaction style selected from a companion's qualified public profile.
          schema: { type: string, minLength: 1, maxLength: 40 }
        - in: query
          name: keyword
          description: Explicit public-catalog keyword, normalized to a nonblank 1–40-character string. Matches public name, role, service tag, or a current active service title only.
          schema: { type: string, minLength: 1, maxLength: 40 }
        - in: query
          name: sortBy
          description: Explicit public ordering — online first, higher rating, more public reviews, lower public per-30-minute profile price, or earliest current structured capacity. soonestAvailable considers the next seven days unless availableWithinDays selects a shorter window; it does not reserve a time and capacity is rechecked later.
          schema: { type: string, enum: [online, rating, reviewCount, priceAsc, soonestAvailable] }
        - in: query
          name: availability
          schema: { type: string }
        - in: query
          name: isOnline
          schema: { type: boolean }
        - in: query
          name: topicId
          description: Match an active public service offering tagged with this stable platform topic id.
          schema: { type: string, enum: [t1, t2, t3, t4, t5, t6] }
        - in: query
          name: deliveryMode
          description: Match an active public service offering by delivery method.
          schema: { type: string, enum: [text, voice] }
        - in: query
          name: maxServicePriceCents
          description: Match an active public service offering whose current one-time total price is at or below this CNY-cent amount.
          schema: { type: integer, minimum: 100, maximum: 2000000 }
        - in: query
          name: availableWithinDays
          description: Limit results to matching active services with a currently free structured candidate starting in the next 1–7 days. Capacity is recomputed on this request; the detail page and order creation recheck it again.
          schema: { type: integer, minimum: 1, maximum: 7 }
      responses:
        "200":
          description: Companion list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/PublicCompanion"
                          pagination:
                            type: object
                            required: [page, pageSize, total, totalPages]
                            properties:
                              page: { type: integer, minimum: 1 }
                              pageSize: { type: integer, minimum: 1, maximum: 100 }
                              total: { type: integer, minimum: 0 }
                              totalPages: { type: integer, minimum: 0 }
  /favorites/companions:
    get:
      tags: [favorites]
      summary: List the current customer's private companion bookmarks
      description: Customer-only private bookmarks. The response reapplies the current public-profile eligibility gate, so unpublished, unverified, suspended, or otherwise ineligible profiles are omitted. Each item contains only the caller's private availability-reminder preference and a fixed minimum interval; it never exposes a subscription grant. This endpoint never creates a follower graph, a companion-visible count, or notifications.
      operationId: listFavoriteCompanions
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Current public companions saved by this customer, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/FavoriteCompanion"
                          pagination:
                            $ref: "#/components/schemas/BoundedPagination"
        "403":
          $ref: "#/components/responses/Error"
  /favorites/companions/{id}/status:
    get:
      tags: [favorites]
      summary: Read one currently public companion's private bookmark status for the current customer
      description: Performs a single caller-and-companion lookup after reapplying public eligibility; it does not scan or expose the caller's bookmark list.
      operationId: getFavoriteCompanionStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Caller-private bookmark and availability-reminder status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FavoriteCompanionStatus"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /favorites/companions/{id}/availability-reminder:
    put:
      tags: [favorites]
      summary: Arm or disarm the current customer's private availability-reminder preference
      description: >-
        Customer-only. The target must still be this caller's currently public bookmark on every write.
        Enabling requires an unconsumed, caller-owned one-time `availabilityReminder` subscription grant
        obtained after an explicit Mini Program prompt; disabling requires no grant. A grant already held by a
        private availability-reminder reservation cannot be rebound here. This endpoint only records the private
        preference and its one-time grant binding: it does not scan availability, create a schedule, queue a
        notification, send a message, or notify the companion. Internal candidate preflight, its later handoff,
        any explicitly enabled bounded preparation or delivery run, any ephemeral post-handoff recheck, private
        authorization reservation, private consumed-grant send lease, aggregate-only operational metric, or private
        provider outcome are invisible to this endpoint and return neither a decision, handoff, aggregate, readiness
        result, reservation, lease, delivery result, nor recipient. Any later delivery must separately recheck current
        public eligibility, real availability, the exact bound unconsumed grant, and the returned minimum interval
        before it can atomically consume that grant; only a separately confirmed provider acceptance counts as sent.
      operationId: setFavoriteAvailabilityReminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                subscriptionGrantId:
                  type: string
                  format: uuid
                  description: Required when `enabled` is true; it must be a current caller-owned `availabilityReminder` grant. Never returned by this endpoint.
      responses:
        "200":
          description: Private preference saved; no notification was queued or sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FavoriteAvailabilityReminderPreference"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /favorites/companions/{id}:
    put:
      tags: [favorites]
      summary: Save one currently public companion as a private bookmark
      description: Customer-only and idempotent. A profile that is no longer publicly eligible is returned as not found rather than revealing its private status.
      operationId: saveFavoriteCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private bookmark saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [favorited, companion]
                        properties:
                          favorited: { type: boolean, enum: [true] }
                          companion:
                            $ref: "#/components/schemas/PublicCompanion"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [favorites]
      summary: Remove one private companion bookmark
      description: Customer-only and idempotent. Removing a bookmark never affects a companion profile, ranking, orders, settlement, or notifications.
      operationId: removeFavoriteCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private bookmark removal result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [favorited, removed]
                        properties:
                          favorited: { type: boolean, enum: [false] }
                          removed: { type: boolean }
        "403":
          $ref: "#/components/responses/Error"
  /recently-viewed/companions:
    get:
      tags: [recently-viewed]
      summary: List the current customer's private companion recall list
      description: Customer-only recent views, newest first, capped at twenty retained records. The response reapplies the current public-profile eligibility gate, so unpublished, unverified, suspended, or otherwise ineligible profiles are omitted. It never feeds recommendations, notifications, a companion-visible profile, orders, refunds, settlement, or marketing, and an old view is never a promise that a current service slot is available.
      operationId: listRecentlyViewedCompanions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current public companions recently opened by this customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 20
                            items:
                              $ref: "#/components/schemas/PublicCompanion"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      tags: [recently-viewed]
      summary: Clear the current customer's private companion recall list
      description: Customer-only. Deletes only the caller's recent-view records and does not affect bookmarks, profiles, recommendations, orders, refunds, settlement, or notifications.
      operationId: clearRecentlyViewedCompanions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Private recent-view records cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cleared]
                        properties:
                          cleared: { type: integer, minimum: 0 }
        "403":
          $ref: "#/components/responses/Error"
  /recently-viewed/companions/{id}:
    put:
      tags: [recently-viewed]
      summary: Record the current customer's opening of one public companion profile
      description: Customer-only and idempotent. Reopening refreshes the private recency timestamp and the server removes older records beyond twenty. A profile that is no longer publicly eligible is returned as not found rather than revealing its private status.
      operationId: recordRecentlyViewedCompanion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Private recall record refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [recorded]
                        properties:
                          recorded: { type: boolean, enum: [true] }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /companions/me/profile:
    get:
      tags: [companions]
      summary: Get the current user's companion profile
      operationId: getOwnCompanionProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [companions]
      summary: Update availability or moderated public companion profile content
      operationId: updateOwnCompanionProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, minLength: 1, maxLength: 500 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                availability: { type: string, enum: [online, available, busy] }
                voiceIntroAssetRef: { type: string, maxLength: 500 }
                voiceIntroDurationSeconds: { type: integer, minimum: 1, maximum: 600 }
      responses:
        "200":
          description: Updated companion profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "409":
          description: >
            First-release text-only refused a voice-intro write
            (`VOICE_INTRO_UNAVAILABLE`). No companion profile mutation occurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Public profile content failed moderation and was not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the profile was not changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/application:
    post:
      tags: [companions]
      summary: Submit an unpublished companion application for staff review
      operationId: applyForCompanion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, bio, pricePerHalfHour, tags, availableTimes, languages, specialties, cityDistrict]
              properties:
                role: { type: string, minLength: 1, maxLength: 80 }
                bio: { type: string, minLength: 1, maxLength: 500 }
                pricePerHalfHour: { type: integer, minimum: 1, maximum: 10000 }
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 40 }
                availableTimes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, maxLength: 40 }
                languages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, maxLength: 40 }
                specialties:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 60 }
                topicIds:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 80 }
                cityDistrict: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Unpublished companion application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "422":
          description: Application public content failed moderation and was not submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Production content moderation provider is temporarily unavailable; the application was not submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/service-offerings:
    get:
      tags: [companions]
      summary: List the current verified companion owner's full service catalog
      description: Includes active and inactive entries plus exact full-catalog total and active counts. This owner-only view does not require the companion to be publicly published yet; summary values never derive from the current page slice.
      operationId: listOwnCompanionServiceOfferings
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Current owner's service catalog in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, summary, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OwnCompanionServiceOffering"
                          summary:
                            type: object
                            required: [total, active]
                            properties:
                              total: { type: integer, minimum: 0 }
                              active: { type: integer, minimum: 0 }
                          pagination:
                            $ref: "#/components/schemas/BoundedPagination"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [companions]
      summary: Create a service offering for the current verified companion owner
      description: Public title and description are moderated before being saved. The stable code is assigned by the server; historic orders retain their own snapshots. Creation is serialized on the companion profile and fails once the catalog contains 50 active, paused, or draft entries.
      operationId: createOwnCompanionServiceOffering
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, deliveryMode, durationMinutes, priceCents]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 500 }
