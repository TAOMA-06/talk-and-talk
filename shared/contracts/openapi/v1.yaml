      description: Available only to the customer or companion owner of a voice SKU after manual acceptance, payment, and the companion's explicit service start. The server derives the room and participant identity; callers cannot choose either. UserSig and privateMapKey are short-lived response secrets and must not be persisted by clients. A refund, service completion, or elapsed service window can terminate an already connected room server-side; clients must handle the provider kicked-out event.
