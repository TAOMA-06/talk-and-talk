        "404":
          $ref: "#/components/responses/Error"
  /companions/me/availability-windows:
    get:
      tags: [companions]
      summary: List the current verified companion owner's structured availability windows
      description: Includes active and retired windows so the owner can operate their own calendar. Results use stable bounded pagination in chronological order and include exact future-active count and next-start summary values derived independently of the page slice.
      operationId: listOwnCompanionAvailabilityWindows
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Current owner's availability windows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, summary, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
                          summary:
                            type: object
                            required: [futureActiveCount, nextFutureActiveStartsAt]
                            properties:
                              futureActiveCount: { type: integer, minimum: 0 }
                              nextFutureActiveStartsAt: { type: string, format: date-time, nullable: true }
                          pagination:
                            $ref: "#/components/schemas/BoundedPagination"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [companions]
      summary: Create a single structured availability window for the current owner
      description: >-
        Active windows require explicit-timezone ISO timestamps on 30-minute boundaries, a future start,
        capacity 1-10, at most 24 hours duration, and no overlap with another active window for the same
        companion. This endpoint creates one explicit window only: private weekly planning rules and one-off
        blackout inputs are not exposed here. A separate internal process may create inactive, owner-reviewable
        drafts from them, but those drafts remain outside customer availability and never imply a promise.
        When this creates a future active window, the server may atomically create private,
        deduplicated availability-reminder candidates only for still-public, armed bookmarks. Candidates may
        later receive an internal, invisible preflight decision, handoff, explicitly enabled bounded
        preparation or delivery run, ephemeral recheck, private authorization reservation, private consumed-grant
        send lease, aggregate-only operational metric, and private provider outcome, but the response never exposes
        a candidate, preflight result, handoff, aggregate, readiness result, reservation, lease, delivery result,
        recipient, reminder count, or authorization token; it does not itself queue or send a notification.
      operationId: createOwnCompanionAvailabilityWindow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, endsAt]
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                capacity: { type: integer, minimum: 1, maximum: 10, default: 1 }
                isActive: { type: boolean, default: true }
      responses:
        "201":
          description: Created availability window
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Active window is too soon or overlaps another active window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/availability-windows/{id}:
    patch:
      tags: [companions]
      summary: Change or retire one of the current owner's availability windows
      description: >-
        A window with a pending, paying, paid, or in-service order cannot be changed or retired. Existing
        order snapshots are never rewritten. Reactivating a future window can atomically create the same
        private, deduplicated candidate records as creation; ordinary active-window edits and retirement do
        not. Candidates and any later internal preflight result, handoff, explicitly enabled bounded preparation
        run, ephemeral recheck, private authorization reservation, private consumed-grant send lease, or private
        provider outcome are not returned, scheduled, queued, or delivered by this endpoint.
      operationId: updateOwnCompanionAvailabilityWindow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                capacity: { type: integer, minimum: 1, maximum: 10 }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated availability window
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The window is too soon, overlaps another active window, or has an active order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
