  /admin/commercial/payment-disputes/{id}/replies:
    post:
      tags: [admin, payments, support]
      summary: Submit an idempotent merchant reply to WeChat Pay
      description: Restricted to admin or the assigned support agent. Response images are existing WeChat media identifiers, never remote URLs or uploaded binaries. A provider timeout leaves an explicit outcome-unknown state that blocks another reply until reconciliation.
      operationId: adminReplyPaymentDispute
      security:
        - bearerAuth: []
      parameters:
