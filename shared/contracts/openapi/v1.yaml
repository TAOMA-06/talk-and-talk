          properties:
            data:
              $ref: "#/components/schemas/AvailabilityReminderTerminalResolution"
    AvailabilityReminderFanoutReadiness:
      type: object
      additionalProperties: false
      required: [status, checkedAt, runner, backlog, pipeline, failedJobSample, failedJobSampleLimit, failedJobSampleTruncated]
      properties:
        status:
          type: string
          enum: [clear, processing, attentionRequired]
          description: Fresh unfinished work is processing only; attentionRequired covers terminal failures, expired leases, due work older than five minutes, or a disabled runner with due work.
        checkedAt: { type: string, format: date-time }
        runner:
          type: object
          additionalProperties: false
          required: [enabled, batchSize, batchesPerRun, leaseSeconds, maxFailures, retryBaseSeconds]
          properties:
            enabled: { type: boolean }
            batchSize: { type: integer, minimum: 1, maximum: 1000 }
            batchesPerRun: { type: integer, minimum: 1, maximum: 100 }
            leaseSeconds: { type: integer, minimum: 30, maximum: 900 }
            maxFailures: { type: integer, minimum: 1, maximum: 50 }
            retryBaseSeconds: { type: integer, minimum: 5, maximum: 900 }
        backlog:
          type: object
          additionalProperties: false
          required: [total, due, processing, retryScheduled, expiredLeases, failed, oldestCreatedAt, oldestDueAgeSeconds, backlogSlaSeconds, backlogSlaBreached, runnerDisabledWithDueBacklog]
          properties:
            total: { type: integer, minimum: 0, description: Exact pending, processing, and retryScheduled job count. }
            due: { type: integer, minimum: 0 }
            processing: { type: integer, minimum: 0 }
            retryScheduled: { type: integer, minimum: 0 }
            expiredLeases: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0, description: Exact terminal failure count. }
            oldestCreatedAt: { type: string, format: date-time, nullable: true }
            oldestDueAgeSeconds: { type: integer, minimum: 0, nullable: true }
            backlogSlaSeconds: { type: integer, enum: [300] }
            backlogSlaBreached: { type: boolean }
            runnerDisabledWithDueBacklog: { type: boolean }
        pipeline:
          type: object
          additionalProperties: false
          required: [status, preparationRunnerEnabled, deliveryRunnerEnabled, pendingCandidates, dueCandidates, expiredPreparationLeases, pending, dueReservations, expiredReservationLeases, pendingWithAttempt, skipped, reservedAttempts, activeAttempts, dueAttempts, expiredAttemptLeases, expiredDeliveryClaimLeases, failedPreparation, failedReservation, failedDelivery, failedBeforeSend, rejected, uncertain, terminalAttempts, oldestCreatedAt, oldestBacklogAgeSeconds, backlogSlaSeconds, backlogSlaBreached, preparationRunnerDisabledWithDueBacklog, deliveryRunnerDisabledWithDueBacklog, checkedAt]
          properties:
            status:
              type: string
              enum: [clear, processing, attentionRequired]
              description: Fresh pending work is diagnostic processing; only stage failures, expired claim or send leases, due work older than five minutes, disabled runners with due work, or unresolved terminal provider outcomes require attention.
            preparationRunnerEnabled: { type: boolean }
            deliveryRunnerEnabled: { type: boolean }
            pendingCandidates: { type: integer, minimum: 0, description: Exact preflight-pending or eligible candidates not yet handed off. }
            dueCandidates: { type: integer, minimum: 0 }
            expiredPreparationLeases: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0, description: Exact handoffs not yet processed by the attempt-reservation boundary. }
            dueReservations: { type: integer, minimum: 0 }
            expiredReservationLeases: { type: integer, minimum: 0 }
            pendingWithAttempt: { type: integer, minimum: 0, description: Crash-recovery subset already holding an attempt but awaiting the atomic processed marker repair pass. }
            skipped: { type: integer, minimum: 0, description: Historical immutable events terminally skipped by the final live reservation recheck. }
            reservedAttempts: { type: integer, minimum: 0, description: Durable attempts waiting for final authorization and provider delivery. }
            activeAttempts: { type: integer, minimum: 0, description: Attempts holding a ready-to-send or sending lease. }
            dueAttempts: { type: integer, minimum: 0 }
            expiredAttemptLeases: { type: integer, minimum: 0 }
            expiredDeliveryClaimLeases: { type: integer, minimum: 0 }
            failedPreparation: { type: integer, minimum: 0, description: Preparation candidates retained in terminal failure before a handoff was created. }
            failedReservation: { type: integer, minimum: 0, description: Handoffs retained in terminal reservation failure before a delivery attempt was reserved. }
            failedDelivery: { type: integer, minimum: 0, description: Delivery attempts retained in one of the three terminal provider states. }
            failedBeforeSend: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            uncertain: { type: integer, minimum: 0, description: Attempts quarantined because the provider outcome cannot safely be retried. }
            terminalAttempts:
              type: object
              additionalProperties: false
              required: [total, resolved, unresolved, byStatus]
              properties:
                total: { type: integer, minimum: 0 }
                resolved: { type: integer, minimum: 0, description: Terminal attempts with an audited operational resolution. }
                unresolved: { type: integer, minimum: 0, description: Terminal attempts still requiring human reconciliation; this never authorizes resend. }
                byStatus:
                  type: object
                  additionalProperties: false
                  required: [failedBeforeSend, rejected, uncertain]
                  properties:
                    failedBeforeSend: { $ref: "#/components/schemas/AvailabilityReminderTerminalStatusCounts" }
                    rejected: { $ref: "#/components/schemas/AvailabilityReminderTerminalStatusCounts" }
                    uncertain: { $ref: "#/components/schemas/AvailabilityReminderTerminalStatusCounts" }
            oldestCreatedAt: { type: string, format: date-time, nullable: true }
            oldestBacklogAgeSeconds: { type: integer, minimum: 0, nullable: true }
            backlogSlaSeconds: { type: integer, minimum: 1, enum: [300] }
            backlogSlaBreached: { type: boolean }
            preparationRunnerDisabledWithDueBacklog: { type: boolean }
            deliveryRunnerDisabledWithDueBacklog: { type: boolean }
            checkedAt: { type: string, format: date-time }
        failedJobSample:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, companionId, availabilityWindowId, failureCount, lastErrorCode, failedAt]
            properties:
              id: { type: string, format: uuid }
              companionId: { type: string, format: uuid }
              availabilityWindowId: { type: string, format: uuid }
              failureCount: { type: integer, minimum: 1 }
              lastErrorCode: { type: string, nullable: true }
              failedAt: { type: string, format: date-time, nullable: true }
        failedJobSampleLimit: { type: integer, enum: [20] }
        failedJobSampleTruncated: { type: boolean }
    AvailabilityReminderFanoutReadinessEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AvailabilityReminderFanoutReadiness"
    AvailabilityReminderFanoutRetryEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [id, status, nextAttemptAt]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [retryScheduled] }
                nextAttemptAt: { type: string, format: date-time }
    CommercialReadinessBlockers:
      type: object
      additionalProperties: false
      required:
        - orderIntakeDisabled
        - payoutClaimsDisabled
        - paymentDisputeIntakeDisabled
        - refundPolicyUnapproved
        - refundPolicySnapshotGaps
        - wechatDailyBillReconciliationDisabled
        - wechatDailyBillReconciliationIncomplete
        - wechatDailyBillOpenIssues
        - wechatDailyBillPendingApprovals
        - wechatDailyBillProviderTimeUnknown
        - wechatCashLedgerUnclassified
        - failedRefunds
        - staleRefunds
        - overdueSupport
        - overdueAccountDeletions
        - accountDeletionExecutionFailed
        - accountDeletionExecutionExpiredLeases
        - accountDeletionExecutionBacklogSlaBreached
        - accountDeletionPendingErasure
        - accountDeletionRetentionApprovalBacklog
        - accountDeletionRetentionPolicyUnapproved
        - dataRetentionLegalHoldPolicyUnapproved
        - dataRetentionLegalHoldPendingActions
        - accountDeletionAuthTombstoneCoverageGaps
        - accountDeletionAuthTombstoneUnknownKeys
        - overdueRetainedExpiryBacklog
        - retainedExpiryFailures
        - overdueUserAccountAppeals
        - overdueCompanionAccountAppeals
        - overdueCompanionRemediationTasks
        - overduePaymentDisputes
        - paymentDisputeSyncFailures
        - notificationDeliveryDisabledWithPending
        - notificationDeliveryOverduePending
        - failedNotifications
        - staleNotificationLeases
        - availabilityReminderFanoutFailed
        - availabilityReminderFanoutExpiredLeases
        - availabilityReminderFanoutBacklogSlaBreached
        - availabilityReminderFanoutRunnerDisabledWithDueBacklog
        - availabilityReminderPreparationFailures
        - availabilityReminderReservationFailures
        - availabilityReminderDeliveryFailures
        - availabilityReminderPreparationExpiredLeases
        - availabilityReminderReservationExpiredLeases
        - availabilityReminderDeliveryClaimExpiredLeases
        - availabilityReminderAttemptExpiredLeases
        - availabilityReminderPipelineBacklogSlaBreached
        - availabilityReminderPreparationRunnerDisabledWithDueBacklog
        - availabilityReminderDeliveryRunnerDisabledWithDueBacklog
        - availabilityReminderTerminalUnresolved
        - pendingCommercialProfiles
        - unresolvedRecoveries
        - stalePayoutClaims
        - moderationProviderUnavailable
        - criticalModeration
        - overdueModeration
        - mediaDeletionBacklog
        - stalePrepays
        - expiredOrderRequests
        - expiredPaymentReservations
        - expiredPaidServiceWindows
        - staleInService
        - voiceRoomControlDisabled
        - voiceEmergencyStopActive
        - voiceTerminationBacklog
        - voiceEmergencyDrainPending
      properties:
        orderIntakeDisabled: { type: integer, minimum: 0 }
        payoutClaimsDisabled: { type: integer, minimum: 0 }
        paymentDisputeIntakeDisabled: { type: integer, minimum: 0 }
        refundPolicyUnapproved: { type: integer, minimum: 0, maximum: 1, description: One when commercial mode lacks an approved controlled refund-policy version and non-secret approval reference. }
        refundPolicySnapshotGaps: { type: integer, minimum: 0, description: Orders with a missing, out-of-range, or completion-deadline-inconsistent immutable refund-policy snapshot. Any value above zero blocks commercial readiness. }
        wechatDailyBillReconciliationDisabled: { type: integer, minimum: 0, maximum: 1 }
        wechatDailyBillReconciliationIncomplete: { type: integer, minimum: 0 }
        wechatDailyBillOpenIssues: { type: integer, minimum: 0 }
        wechatDailyBillPendingApprovals: { type: integer, minimum: 0 }
        wechatDailyBillProviderTimeUnknown: { type: integer, minimum: 0 }
        wechatCashLedgerUnclassified: { type: integer, minimum: 0, description: Provider cash-ledger entries whose business type or local binding remains unclassified. }
        failedRefunds: { type: integer, minimum: 0 }
        staleRefunds: { type: integer, minimum: 0 }
        overdueSupport: { type: integer, minimum: 0 }
        overdueAccountDeletions: { type: integer, minimum: 0 }
        accountDeletionExecutionFailed: { type: integer, minimum: 0, description: Approved phased-erasure executions in terminal failure awaiting a controlled operator retry. }
        accountDeletionExecutionExpiredLeases: { type: integer, minimum: 0, description: Processing phased-erasure executions with a missing or expired worker lease. }
        accountDeletionExecutionBacklogSlaBreached: { type: integer, minimum: 0, maximum: 1, description: One when the oldest actionable phased-erasure execution has been due for more than five minutes. }
        accountDeletionPendingErasure:
          type: integer
          minimum: 0
          description: Retention-ledger categories awaiting actual erasure or retry; a completed account request does not clear this blocker by itself.
        accountDeletionRetentionApprovalBacklog:
          type: integer
          minimum: 0
          description: Retention-ledger rows still marked pendingLegalApproval across all dispositions; the blocker clears only after the worker records approval on each row.
        accountDeletionRetentionPolicyUnapproved:
          type: integer
          minimum: 0
          maximum: 1
          description: One until an external legal approval flag and a non-secret approval reference are both configured; the reference itself is never returned.
        dataRetentionLegalHoldPolicyUnapproved:
          type: integer
          minimum: 0
          maximum: 1
          description: One until the legal-hold mutation API and the commercial readiness gate agree that the externally approved version, non-secret approval reference, and controlled reason catalog are valid.
        dataRetentionLegalHoldPendingActions:
          type: integer
          minimum: 0
          description: Pending placement or release actions awaiting an independent administrator decision. A pending placement already blocks expiry; a pending release leaves the active hold in force.
        accountDeletionAuthTombstoneCoverageGaps:
          type: integer
          minimum: 0
          description: Processing or completed deletion requests whose authentication identities do not have complete tombstone provenance coverage.
        accountDeletionAuthTombstoneUnknownKeys:
          type: integer
          minimum: 0
          description: Active authentication tombstones signed by a key absent from the configured keyring; any value above zero fails new identity registration closed.
        overdueRetainedExpiryBacklog: { type: integer, minimum: 0, description: Approved retained records past retentionEndsAt whose expiry erasure has not completed. }
        retainedExpiryFailures: { type: integer, minimum: 0, description: Retention-expiry erasure rows with a recorded failed attempt awaiting bounded retry. }
        overdueUserAccountAppeals:
          type: integer
          minimum: 0
          description: Pending ordinary-user account appeals whose immutable review deadline has passed.
        overdueCompanionAccountAppeals:
          type: integer
          minimum: 0
          description: Pending companion account-action appeals whose immutable review deadline has passed.
        overdueCompanionRemediationTasks:
          type: integer
          minimum: 0
          description: Companion remediation tasks already marked overdue by the quality worker.
        overduePaymentDisputes: { type: integer, minimum: 0 }
