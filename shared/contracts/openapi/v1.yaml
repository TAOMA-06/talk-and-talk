      description: Admin-only first-person action. Requesting release does not remove the disposal barrier. The hold remains active until a different active administrator approves the release.
      operationId: adminRequestDataRetentionLegalHoldRelease
      security:
        - bearerAuth: []
      parameters:
        - { name: legalHoldId, in: path, required: true, schema: { type: string, format: uuid } }
