  /companions/me/availability-schedule/rules:
    get:
      tags: [companions]
      summary: List the current verified companion owner's private weekly scheduling rules
      description: >-
        Includes active and retired planning rules, capped at 200 entries. This is not a public availability
        endpoint: it never returns a customer-facing candidate, companion identifier, materialized draft,
        order, reminder candidate, or notification result.
      operationId: listOwnCompanionRecurringAvailabilityRules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current owner's recurring scheduling rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OwnCompanionRecurringAvailabilityRule"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [companions]
      summary: Create a private weekly scheduling rule for the current owner
      description: >-
        The server fixes the timezone to Asia/Shanghai and creates an active planning rule only. It does not
        materialize, activate, edit, or retire any concrete availability window; does not invoke a draft
        generator; and does not create a reminder candidate, notification, order, or external calendar event.
      operationId: createOwnCompanionRecurringAvailabilityRule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, startsAtMinute, endsAtMinute]
              properties:
                weekday:
                  type: integer
                  minimum: 0
                  maximum: 6
                  description: Local Asia/Shanghai weekday, where 0 is Sunday and 6 is Saturday.
                startsAtMinute:
                  type: integer
                  minimum: 0
                  maximum: 1410
                  multipleOf: 30
                  description: Minutes after local midnight on the same weekday.
                endsAtMinute:
                  type: integer
                  minimum: 30
                  maximum: 1440
                  multipleOf: 30
                  description: Must be later than startsAtMinute on the same local weekday.
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
      responses:
        "201":
          description: Created private scheduling rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionRecurringAvailabilityRule"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The new rule overlaps an active rule owned by the same companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/availability-schedule/rules/{id}/deactivate:
    patch:
      tags: [companions]
      summary: Retire one of the current owner's private weekly scheduling rules
      description: >-
        The operation is idempotent and only changes this owned rule to inactive. It never deletes history,
        auto-enables or removes existing drafts, changes an availability window, alters an order, produces a
        reminder candidate, or calls an external calendar.
      operationId: deactivateOwnCompanionRecurringAvailabilityRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Retired private scheduling rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionRecurringAvailabilityRule"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /companions/me/availability-schedule/blackouts:
    get:
      tags: [companions]
      summary: List the current verified companion owner's private scheduling exceptions
      description: >-
        Includes active and retired exceptions, capped at 200 entries. This owner-only result omits the
        companion identifier and never exposes drafts, public availability, orders, reminder candidates,
        recipients, or notification delivery information.
      operationId: listOwnCompanionAvailabilityBlackouts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current owner's private scheduling exceptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OwnCompanionAvailabilityBlackout"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [companions]
      summary: Create a private one-off scheduling exception for the current owner
      description: >-
        Timestamps must carry an explicit timezone and align to 30-minute boundaries. The server stores an
        active Asia/Shanghai planning exception only; it does not modify existing drafts or concrete windows,
        change bookings, create reminder candidates, or call an external calendar.
      operationId: createOwnCompanionAvailabilityBlackout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, endsAt]
              properties:
                startsAt:
                  type: string
                  format: date-time
                  description: ISO-8601 timestamp with an explicit timezone offset or Z suffix.
                endsAt:
                  type: string
                  format: date-time
                  description: Must be later than startsAt, with an explicit timezone offset or Z suffix.
      responses:
        "201":
          description: Created private scheduling exception
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityBlackout"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The exception is too soon or overlaps an active exception owned by the same companion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/availability-schedule/blackouts/{id}/deactivate:
    patch:
      tags: [companions]
      summary: Retire one of the current owner's private scheduling exceptions
      description: >-
        The operation is idempotent and only changes this owned exception to inactive. It does not delete the
        exception, update a materialized draft or concrete availability window, alter an order, create a
        reminder candidate, or invoke an external calendar.
      operationId: deactivateOwnCompanionAvailabilityBlackout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Retired private scheduling exception
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityBlackout"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /companions/me/availability-windows:
    get:
      tags: [companions]
      summary: List the current verified companion owner's structured availability windows
      description: Includes active and retired windows so the owner can operate their own calendar. The result is capped at 200 entries in chronological order.
      operationId: listOwnCompanionAvailabilityWindows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current owner's availability windows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [companions]
      summary: Create a single structured availability window for the current owner
      description: >-
        Active windows require explicit-timezone ISO timestamps on 30-minute boundaries, a future start,
        capacity 1-10, at most 24 hours duration, and no overlap with another active window for the same
        companion. This endpoint creates one explicit window only: private weekly planning rules and one-off
        blackout inputs are not exposed here. A separate internal process may create inactive, owner-reviewable
        drafts from them, but those drafts remain outside customer availability and never imply a promise.
        When this creates a future active window, the server may atomically create private,
        deduplicated availability-reminder candidates only for still-public, armed bookmarks. Candidates may
        later receive an internal, invisible preflight decision, handoff, explicitly enabled bounded
        preparation or delivery run, ephemeral recheck, private authorization reservation, private consumed-grant
        send lease, aggregate-only operational metric, and private provider outcome, but the response never exposes
        a candidate, preflight result, handoff, aggregate, readiness result, reservation, lease, delivery result,
        recipient, reminder count, or authorization token; it does not itself queue or send a notification.
      operationId: createOwnCompanionAvailabilityWindow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, endsAt]
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                capacity: { type: integer, minimum: 1, maximum: 10, default: 1 }
                isActive: { type: boolean, default: true }
      responses:
        "201":
          description: Created availability window
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Active window is too soon or overlaps another active window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companions/me/availability-windows/{id}:
    patch:
      tags: [companions]
      summary: Change or retire one of the current owner's availability windows
      description: >-
        A window with a pending, paying, paid, or in-service order cannot be changed or retired. Existing
        order snapshots are never rewritten. Reactivating a future window can atomically create the same
        private, deduplicated candidate records as creation; ordinary active-window edits and retirement do
        not. Candidates and any later internal preflight result, handoff, explicitly enabled bounded preparation
        run, ephemeral recheck, private authorization reservation, private consumed-grant send lease, or private
        provider outcome are not returned, scheduled, queued, or delivered by this endpoint.
      operationId: updateOwnCompanionAvailabilityWindow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                capacity: { type: integer, minimum: 1, maximum: 10 }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated availability window
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OwnCompanionAvailabilityWindow"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The window is too soon, overlaps another active window, or has an active order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
