      tags: [admin]
      summary: Start account-deletion settlement and record the first administrator
      description: Admin-only first-person control. All customer and companion-side obligations must have drained before the account is restricted; workforce accounts require a separate controlled offboarding workflow. The response names the processing administrator and timestamp; completion must be performed later by a different administrator.
      operationId: adminStartAccountDeletion
      security:
