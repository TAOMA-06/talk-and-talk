        updatedAt: { type: string, format: date-time }
    PaymentDisputeAttachmentEvidence:
      type: object
      additionalProperties: false
      required: [id, replyId, source, mediaType, providerMediaId, remoteUrlDigest, createdAt]
      properties:
        id: { type: string, format: uuid }
        replyId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [provider, merchant] }
        mediaType: { type: string }
        providerMediaId: { type: string, nullable: true }
        remoteUrlDigest: { type: string, pattern: "^[a-f0-9]{64}$", nullable: true }
        createdAt: { type: string, format: date-time }
    PaymentDisputeNegotiationEvidence:
      type: object
      additionalProperties: false
      required: [id, providerLogId, operator, operateType, operateDetails, operatedAt, mediaCount]
      properties:
        id: { type: string, format: uuid }
        providerLogId: { type: string }
        operator: { type: string }
        operateType: { type: string }
        operateDetails: { type: string, nullable: true }
        operatedAt: { type: string, format: date-time, nullable: true }
        mediaCount: { type: integer, minimum: 0 }
    PaymentDisputeComplaintOrderEvidence:
      type: object
      additionalProperties: false
      required: [id, orderId, paymentId, outTradeNoMasked, transactionIdMasked, amountCents, matched, providerSeenAt, matchedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        paymentId: { type: string, format: uuid, nullable: true }
        outTradeNoMasked: { type: string, nullable: true }
        transactionIdMasked: { type: string, nullable: true }
        amountCents: { type: integer, minimum: 0 }
        matched: { type: boolean }
        providerSeenAt: { type: string, format: date-time }
        matchedAt: { type: string, format: date-time, nullable: true }
    PaymentDisputeRecoveryEvidence:
      type: object
      additionalProperties: false
      required: [id, status, reason, amountCents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [due, pendingVerification, recovered, waived] }
        reason: { type: string, enum: [confirmedPaidBeforeRefund, payoutStateUncertain, paymentDisputeAfterPayout] }
        amountCents: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentDisputeEvidencePageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [resource, items, pagination]
              properties:
                resource:
                  type: string
                  enum: [notifications, replies, attachments, negotiation-events, complaint-orders, recoveries]
                items:
                  type: array
                  maxItems: 100
                  items:
                    description: Typed role-scoped evidence; no raw provider payload is returned.
                    oneOf:
                      - $ref: "#/components/schemas/PaymentDisputeNotificationEvidence"
                      - $ref: "#/components/schemas/PaymentDisputeReplyEvidence"
                      - $ref: "#/components/schemas/PaymentDisputeAttachmentEvidence"
                      - $ref: "#/components/schemas/PaymentDisputeNegotiationEvidence"
                      - $ref: "#/components/schemas/PaymentDisputeComplaintOrderEvidence"
                      - $ref: "#/components/schemas/PaymentDisputeRecoveryEvidence"
                pagination:
                  type: object
                  additionalProperties: false
                  required: [page, pageSize, total, totalPages, nextPage]
                  properties:
                    page: { type: integer, minimum: 1 }
                    pageSize: { type: integer, minimum: 1, maximum: 100 }
                    total: { type: integer, minimum: 0 }
                    totalPages: { type: integer, minimum: 1 }
                    nextPage: { type: integer, minimum: 2, nullable: true }
