        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDataRetentionLegalHoldAction"
      responses:
        "200":
          description: Idempotent pending placement action; retention disposal is blocked immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRetentionLegalHoldMutationEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
