        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Consumer or commercial-staff JWT, according to the route's role guards.
    reviewBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Review JWT
      description: Isolated independent review-department access token; consumer and commercial-staff JWTs are rejected.
    metricsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
      description: Dedicated METRICS_TOKEN credential required only in production.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error:
      description: Envelope error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LoginIdentityUnavailable:
      description: The reverified external login identifier is temporarily unavailable. The response intentionally exposes no previous-account status, dates, policy, or re-registration timing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginIdentityUnavailableErrorEnvelope"
  schemas:
    CrisisInterventionSource:
      type: string
      enum: [homeIntent, homeBrowseAll, homeRecommendation, discover, companionDetail, order, chatSafetyRule, directEmergencyHelp]
    CrisisInterventionRiskCode:
      type: string
      enum: [userRequested, selfHarmSignal, violenceSignal, immediateDangerSignal, chatSafetyRule]
    CreateCrisisInterventionInput:
      type: object
      additionalProperties: false
      required: [source, riskCode, region]
      properties:
        source:
          $ref: "#/components/schemas/CrisisInterventionSource"
        riskCode:
          $ref: "#/components/schemas/CrisisInterventionRiskCode"
