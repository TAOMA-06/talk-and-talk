name: Mini Program CI

on:
  push:
    paths:
      - "frontend/miniprogram/**"
      - "backend/api/src/**"
      - "backend/api/prisma/**"
      - "backend/api/public/legal/**"
      - "backend/api/package.json"
      - "backend/api/package-lock.json"
      - "shared/contracts/**"
      - ".github/workflows/miniprogram.yml"
  pull_request:
    paths:
      - "frontend/miniprogram/**"
      - "backend/api/src/**"
      - "backend/api/prisma/**"
      - "backend/api/public/legal/**"
      - "backend/api/package.json"
      - "backend/api/package-lock.json"
      - "shared/contracts/**"
      - ".github/workflows/miniprogram.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install shared TypeScript toolchain
        working-directory: backend/api
        run: npm ci
      - name: Validate Mini Program manifest and pages
        env:
          MINIPROGRAM_RELEASE: "1"
          WECHAT_MINIPROGRAM_APP_ID: ${{ vars.WECHAT_MINIPROGRAM_APP_ID }}
        run: node frontend/miniprogram/scripts/validate.mjs
      - name: Verify shared profile and legal-consent contracts
        working-directory: backend/api
        run: npm test -- --runTestsByPath src/users/dto/update-me.dto.spec.ts src/users/dto/legal-consent.dto.spec.ts
      - name: Type-check Mini Program
        run: backend/api/node_modules/.bin/tsc -p frontend/miniprogram/tsconfig.json --noEmit
      - name: Run Mini Program page/runtime smoke
        run: node frontend/miniprogram/scripts/smoke.mjs
