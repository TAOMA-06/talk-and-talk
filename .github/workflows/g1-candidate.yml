name: G1 candidate metadata hygiene (untrusted)

# This repository-owned workflow is a notification-only Git metadata check. It
# must never be treated as candidate admission, CI evidence, or a security
# boundary: it does not install or execute candidate code. Candidate validation
# is performed only by the separately protected external control-plane contract.
on:
  push:
    paths:
      - ".github/workflows/api.yml"
      - ".github/workflows/g1-candidate.yml"
      - ".github/workflows/g1-candidate-control-plane.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/miniprogram.yml"
      - ".github/workflows/web.yml"
      - "scripts/**"
      - "backend/api/**"
      - "frontend/ios/**"
      - "frontend/miniprogram/**"
      - "frontend/web/**"
  pull_request:
    paths:
      - ".github/workflows/api.yml"
      - ".github/workflows/g1-candidate.yml"
      - ".github/workflows/g1-candidate-control-plane.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/miniprogram.yml"
      - ".github/workflows/web.yml"
      - "scripts/**"
      - "backend/api/**"
      - "frontend/ios/**"
      - "frontend/miniprogram/**"
      - "frontend/web/**"

permissions:
  contents: read

env:
  BASH_ENV: /dev/null
  DYLD_FORCE_FLAT_NAMESPACE: ""
  DYLD_INSERT_LIBRARIES: ""
  DYLD_LIBRARY_PATH: ""
  DYLD_ROOT_PATH: ""
  ENV: /dev/null
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_NOSYSTEM: "1"
  LD_AUDIT: ""
  LD_LIBRARY_PATH: ""
  LD_PRELOAD: ""
  NODE_OPTIONS: ""
  NODE_PATH: ""

jobs:
  metadata:
    name: Verify candidate metadata without executing candidate code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          submodules: false
      - name: Seal command files and verify checked-out metadata
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          export GITHUB_ENV=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null
          readonly PATH GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false rev-parse HEAD | /usr/bin/grep -Fx "$GITHUB_SHA"
          test -z "$(/usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false status --porcelain --untracked-files=all)"
          /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false diff --check --no-ext-diff
