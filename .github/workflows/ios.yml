name: iOS

on:
  push:
    branches: [main]
    paths:
      - "frontend/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "frontend/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Unit tests
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TalkAndTalk.xcodeproj \
            -scheme TalkAndTalk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:TalkAndTalkTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild test \
            -project TalkAndTalk.xcodeproj \
            -scheme TalkAndTalk \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:TalkAndTalkTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release artifact
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -project TalkAndTalk.xcodeproj \
            -scheme TalkAndTalk \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TalkAndTalkDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Reject Demo data in Release
        working-directory: frontend/ios
        run: Scripts/check_release_artifact.sh "$RUNNER_TEMP/TalkAndTalkDerivedData/Build/Products/Release-iphonesimulator/TalkAndTalk.app"
