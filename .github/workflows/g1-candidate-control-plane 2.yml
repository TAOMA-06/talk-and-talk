name: G1 trusted candidate control-plane contract

# SECURITY CONTRACT — deliberately fail closed.
#
# This repository copy is reviewable source, not a deployable privileged
# control plane. Before it may be enabled, this exact workflow and the control
# harnesses it names must live in a separate control repository with different
# administrators from the candidate repository. That repository must enforce
# immutable protected g1-control-* tags, required independent reviewers, no
# self-review or bypass, a reviewed authorization registry that binds each
# Evidence ID to one candidate repository/SHA/tree, and a dedicated runner-group ACL.
# The candidate runner group must expose neither a
# container-engine socket nor a privileged daemon; it must be ephemeral, use a
# digest-pinned image with a root-file-system control harness outside the
# candidate workspace, and have separately reviewed token, command-file, and
# egress isolation. This file cannot create or verify any of those external controls.
# Missing bindings fail before candidate source is checked out or executed.
on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Exact owner/repository of the separately frozen candidate source
        required: true
        type: string
      candidate_sha:
        description: Exact lowercase 40-character frozen candidate commit SHA
        required: true
        type: string
      candidate_source_tree_sha256:
        description: Exact lowercase SHA-256 of the captured candidate source tree
        required: true
        type: string
      control_authorization_evidence:
        description: Non-secret Evidence ID that must match the protected control-plane approval record
        required: true
        type: string

permissions:
  contents: read

# These values are set before any control-owned action or shell starts. The
# protected control runner must also attest that it cannot inject equivalent
# process state out of band; this source contract never treats candidate code
# as the policy origin.
env:
  BASH_ENV: /dev/null
  DYLD_FORCE_FLAT_NAMESPACE: ""
  DYLD_INSERT_LIBRARIES: ""
  DYLD_LIBRARY_PATH: ""
  DYLD_ROOT_PATH: ""
  ENV: /dev/null
  LD_AUDIT: ""
  LD_LIBRARY_PATH: ""
  LD_PRELOAD: ""
  NODE_OPTIONS: ""
  NODE_PATH: ""

jobs:
  control-bind:
    name: Bind externally protected control source before candidate checkout
    environment:
      name: g1-candidate-control-plane
    runs-on: [self-hosted, linux, x64, talktalk-g1-control]
    outputs:
      candidate_repository: ${{ steps.bind.outputs.candidate_repository }}
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
      candidate_source_tree_sha256: ${{ steps.bind.outputs.candidate_source_tree_sha256 }}
      candidate_runner_image: ${{ steps.bind.outputs.candidate_runner_image }}
      control_harness_sha256: ${{ steps.bind.outputs.control_harness_sha256 }}
      control_repository: ${{ steps.bind.outputs.control_repository }}
      control_sha: ${{ steps.bind.outputs.control_sha }}
    steps:
      - name: Reject an unbound or in-repository control plane
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_SOURCE_TREE_SHA256: ${{ inputs.candidate_source_tree_sha256 }}
          CONTROL_APPROVAL_REFERENCE: ${{ vars.G1_CONTROL_PLANE_APPROVAL_REFERENCE }}
          CONTROL_AUTHORIZATION_EVIDENCE: ${{ inputs.control_authorization_evidence }}
          CONTROL_REF: ${{ vars.G1_CONTROL_PLANE_IMMUTABLE_REF }}
          CONTROL_REPOSITORY: ${{ vars.G1_CONTROL_PLANE_REPOSITORY }}
          CONTROL_SHA: ${{ vars.G1_CONTROL_PLANE_SHA }}
          CONTROL_AUTHORIZATION_REGISTER_REFERENCE: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_REFERENCE }}
          CONTROL_AUTHORIZATION_REGISTER_SHA256: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_SHA256 }}
          CANDIDATE_RUNNER_IMAGE: ${{ vars.G1_CANDIDATE_SOCKETLESS_RUNNER_IMAGE }}
          CONTROL_HARNESS_SHA256: ${{ vars.G1_CANDIDATE_SOCKETLESS_HARNESS_SHA256 }}
        run: |
          set -euo pipefail
          fail() { echo "G1 control-plane contract refused: $1" >&2; exit 1; }
          [ "$GITHUB_REF_PROTECTED" = "true" ] || fail "the executing control ref must be protected"
          [ -n "$CONTROL_APPROVAL_REFERENCE" ] || fail "protected control-plane approval reference is missing"
          [ "$CONTROL_AUTHORIZATION_EVIDENCE" = "$CONTROL_APPROVAL_REFERENCE" ] || fail "dispatch evidence does not match protected control-plane approval"
          [[ "$CONTROL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "protected control repository is invalid"
          [[ "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "candidate repository is invalid"
          [ "$GITHUB_REPOSITORY" = "$CONTROL_REPOSITORY" ] || fail "workflow must execute from the external control repository"
          [ "$CANDIDATE_REPOSITORY" != "$CONTROL_REPOSITORY" ] || fail "candidate and control repositories must be independently administered"
          case "$CONTROL_REF" in refs/tags/g1-control-[0-9A-Za-z._-]*) ;; *) fail "protected control ref must be an immutable g1-control-* tag" ;; esac
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "protected control SHA is invalid"
          [ "$GITHUB_REF" = "$CONTROL_REF" ] || fail "executing ref does not equal protected immutable control ref"
          [ "$GITHUB_WORKFLOW_SHA" = "$CONTROL_SHA" ] || fail "workflow source SHA does not equal protected control SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "candidate SHA is invalid"
          [[ "$CANDIDATE_SOURCE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "candidate source-tree SHA-256 is invalid"
          [[ "$CONTROL_AUTHORIZATION_REGISTER_REFERENCE" =~ ^[A-Z][A-Z0-9_-]{2,127}$ ]] || fail "protected authorization-register reference is invalid"
          [[ "$CONTROL_AUTHORIZATION_REGISTER_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "protected authorization-register SHA-256 is invalid"
          [[ "$CANDIDATE_RUNNER_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]] || fail "candidate runner image must be digest pinned"
          [[ "$CONTROL_HARNESS_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "candidate control-harness SHA-256 is invalid"
      - name: Checkout the immutable external control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.G1_CONTROL_PLANE_REPOSITORY }}
          ref: ${{ vars.G1_CONTROL_PLANE_IMMUTABLE_REF }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - id: bind
        name: Verify the checked-out control tag and expose only bound inputs
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_SOURCE_TREE_SHA256: ${{ inputs.candidate_source_tree_sha256 }}
          CONTROL_REPOSITORY: ${{ vars.G1_CONTROL_PLANE_REPOSITORY }}
          CONTROL_SHA: ${{ vars.G1_CONTROL_PLANE_SHA }}
          CONTROL_APPROVAL_REFERENCE: ${{ vars.G1_CONTROL_PLANE_APPROVAL_REFERENCE }}
          CONTROL_AUTHORIZATION_EVIDENCE: ${{ inputs.control_authorization_evidence }}
          CONTROL_AUTHORIZATION_REGISTER_REFERENCE: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_REFERENCE }}
          CONTROL_AUTHORIZATION_REGISTER_SHA256: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_SHA256 }}
          CANDIDATE_RUNNER_IMAGE: ${{ vars.G1_CANDIDATE_SOCKETLESS_RUNNER_IMAGE }}
          CONTROL_HARNESS_SHA256: ${{ vars.G1_CANDIDATE_SOCKETLESS_HARNESS_SHA256 }}
        run: |
          set -euo pipefail
          fail() { echo "G1 control-plane contract refused: $1" >&2; exit 1; }
          [ "$(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD)" = "$CONTROL_SHA" ] || fail "checked-out control source does not match protected control SHA"
          [ -z "$(git -C "$GITHUB_WORKSPACE/control" status --porcelain=v1 --untracked-files=all)" ] || fail "control checkout is not clean"
          AUTHORIZATION_RESOLVER="$GITHUB_WORKSPACE/control/scripts/g1-candidate-control-plane/resolve-candidate-authorization.sh"
          [ -x "$AUTHORIZATION_RESOLVER" ] || fail "external control authorization resolver is missing or not executable"
          "$AUTHORIZATION_RESOLVER" \
            --authorization-evidence "$CONTROL_AUTHORIZATION_EVIDENCE" \
            --candidate-repository "$CANDIDATE_REPOSITORY" \
            --candidate-sha "$CANDIDATE_SHA" \
            --candidate-source-tree-sha256 "$CANDIDATE_SOURCE_TREE_SHA256" \
            --control-approval-reference "$CONTROL_APPROVAL_REFERENCE" \
            --authorization-register-reference "$CONTROL_AUTHORIZATION_REGISTER_REFERENCE" \
            --authorization-register-sha256 "$CONTROL_AUTHORIZATION_REGISTER_SHA256"
          {
            printf 'candidate_repository=%s\n' "$CANDIDATE_REPOSITORY"
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
            printf 'candidate_source_tree_sha256=%s\n' "$CANDIDATE_SOURCE_TREE_SHA256"
            printf 'candidate_runner_image=%s\n' "$CANDIDATE_RUNNER_IMAGE"
            printf 'control_harness_sha256=%s\n' "$CONTROL_HARNESS_SHA256"
            printf 'control_repository=%s\n' "$CONTROL_REPOSITORY"
            printf 'control_sha=%s\n' "$CONTROL_SHA"
          } >> "$GITHUB_OUTPUT"

  candidate-runner:
    name: Run candidate only through the socketless control harness
    needs: control-bind
    # The runner-group ACL and image supply chain are external prerequisites.
    # This job receives no protected environment variables or secrets.
    runs-on: [self-hosted, linux, x64, talktalk-g1-candidate-socketless]
    container:
      image: ${{ needs.control-bind.outputs.candidate_runner_image }}
      options: >-
        --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g
        --cap-drop=ALL --security-opt no-new-privileges
    env:
      CANDIDATE_REPOSITORY: ${{ needs.control-bind.outputs.candidate_repository }}
      CANDIDATE_SHA: ${{ needs.control-bind.outputs.candidate_sha }}
      CANDIDATE_SOURCE_TREE_SHA256: ${{ needs.control-bind.outputs.candidate_source_tree_sha256 }}
      CONTROL_SHA: ${{ needs.control-bind.outputs.control_sha }}
      CONTROL_HARNESS_SHA256: ${{ needs.control-bind.outputs.control_harness_sha256 }}
      DOCKER_HOST: ""
    steps:
      - name: Assert that the candidate container has no engine endpoint
        shell: bash
        run: |
          set -euo pipefail
          [ -z "${DOCKER_HOST:-}" ] || { echo "candidate container received an engine endpoint" >&2; exit 1; }
          [ ! -S /var/run/docker.sock ] || { echo "candidate container has a forbidden engine socket" >&2; exit 1; }
          [ ! -S /run/docker.sock ] || { echo "candidate container has a forbidden engine socket" >&2; exit 1; }
      - name: Checkout the frozen candidate as isolated input data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.control-bind.outputs.candidate_repository }}
          ref: ${{ needs.control-bind.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run candidate through the immutable executor-image control harness
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ENV=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null
          readonly GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH GITHUB_STEP_SUMMARY
          unset DOCKER_HOST
          [ ! -S /var/run/docker.sock ] || { echo "candidate container has a forbidden engine socket" >&2; exit 1; }
          [ ! -S /run/docker.sock ] || { echo "candidate container has a forbidden engine socket" >&2; exit 1; }
          # The immutable, digest-pinned executor image supplies this root-file-system
          # harness. It is deliberately not checked out or mounted beside candidate
          # data; --read-only plus the external runner attestation keep it outside
          # the candidate write boundary.
          CONTROL_HARNESS="/opt/talktalk-g1-control/run-socketless-candidate"
          [ -x "$CONTROL_HARNESS" ] && [ ! -L "$CONTROL_HARNESS" ] || { echo "immutable control harness is missing or invalid" >&2; exit 1; }
          ACTUAL_HARNESS_SHA256="$(/usr/bin/sha256sum "$CONTROL_HARNESS" | /usr/bin/awk '{print $1}')"
          [ "$ACTUAL_HARNESS_SHA256" = "$CONTROL_HARNESS_SHA256" ] || { echo "immutable control harness digest does not match protected binding" >&2; exit 1; }
          "$CONTROL_HARNESS" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --candidate-source-tree-sha256 "$CANDIDATE_SOURCE_TREE_SHA256" \
            --control-sha "$CONTROL_SHA"

  trusted-receipt:
    name: Generate a separate trusted control-plane receipt
    if: ${{ always() }}
    needs: [control-bind, candidate-runner]
    environment:
      name: g1-candidate-control-plane
    runs-on: [self-hosted, linux, x64, talktalk-g1-control]
    steps:
      - name: Checkout the immutable external control source for receipt custody
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.G1_CONTROL_PLANE_REPOSITORY }}
          ref: ${{ vars.G1_CONTROL_PLANE_IMMUTABLE_REF }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Generate trusted receipt without candidate outputs
        shell: bash
        env:
          CONTROL_BIND_RESULT: ${{ needs.control-bind.result }}
          CANDIDATE_JOB_RESULT: ${{ needs.candidate-runner.result }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_SOURCE_TREE_SHA256: ${{ inputs.candidate_source_tree_sha256 }}
          CONTROL_APPROVAL_REFERENCE: ${{ vars.G1_CONTROL_PLANE_APPROVAL_REFERENCE }}
          CONTROL_AUTHORIZATION_EVIDENCE: ${{ inputs.control_authorization_evidence }}
          CONTROL_REPOSITORY: ${{ vars.G1_CONTROL_PLANE_REPOSITORY }}
          CONTROL_SHA: ${{ vars.G1_CONTROL_PLANE_SHA }}
          CANDIDATE_RUNNER_IMAGE: ${{ vars.G1_CANDIDATE_SOCKETLESS_RUNNER_IMAGE }}
          CONTROL_HARNESS_SHA256: ${{ vars.G1_CANDIDATE_SOCKETLESS_HARNESS_SHA256 }}
          BOUND_CANDIDATE_RUNNER_IMAGE: ${{ needs.control-bind.outputs.candidate_runner_image }}
          BOUND_CONTROL_HARNESS_SHA256: ${{ needs.control-bind.outputs.control_harness_sha256 }}
          CONTROL_AUTHORIZATION_REGISTER_REFERENCE: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_REFERENCE }}
          CONTROL_AUTHORIZATION_REGISTER_SHA256: ${{ vars.G1_CONTROL_PLANE_AUTHORIZATION_REGISTER_SHA256 }}
          RECEIPT_OUT: ${{ runner.temp }}/g1-control-plane-receipt.json
        run: |
          set -euo pipefail
          fail() { echo "G1 trusted receipt refused: $1" >&2; exit 1; }
          [ "$GITHUB_REPOSITORY" = "$CONTROL_REPOSITORY" ] || fail "receipt job must execute from the external control repository"
          [ "$GITHUB_WORKFLOW_SHA" = "$CONTROL_SHA" ] || fail "receipt workflow source SHA is not the protected control SHA"
          [ "$(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD)" = "$CONTROL_SHA" ] || fail "receipt control checkout does not match protected control SHA"
          [[ "$CANDIDATE_RUNNER_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]] || fail "protected candidate runner image is invalid"
          [[ "$CONTROL_HARNESS_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "protected control harness SHA-256 is invalid"
          [[ "$CONTROL_AUTHORIZATION_REGISTER_REFERENCE" =~ ^[A-Z][A-Z0-9_-]{2,127}$ ]] || fail "protected authorization-register reference is invalid"
          [[ "$CONTROL_AUTHORIZATION_REGISTER_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "protected authorization-register SHA-256 is invalid"
          case "$CONTROL_BIND_RESULT" in
            success)
              [ "$CONTROL_AUTHORIZATION_EVIDENCE" = "$CONTROL_APPROVAL_REFERENCE" ] || fail "admitted control-bind lacks matching protected authorization"
              [ "$BOUND_CANDIDATE_RUNNER_IMAGE" = "$CANDIDATE_RUNNER_IMAGE" ] || fail "admitted candidate runner image does not match control binding"
              [ "$BOUND_CONTROL_HARNESS_SHA256" = "$CONTROL_HARNESS_SHA256" ] || fail "admitted control harness does not match control binding"
              ADMISSION_STATE="admitted"; ADMISSION_REASON_CATEGORY="control-bind-success"
              ;;
            failure)
              ADMISSION_STATE="denied"
              if [ -z "$CONTROL_AUTHORIZATION_EVIDENCE" ]; then
                ADMISSION_REASON_CATEGORY="authorization-missing"
              elif [ "$CONTROL_AUTHORIZATION_EVIDENCE" != "$CONTROL_APPROVAL_REFERENCE" ]; then
                ADMISSION_REASON_CATEGORY="authorization-mismatch"
              else
                ADMISSION_REASON_CATEGORY="control-bind-failed"
              fi
              ;;
            cancelled) ADMISSION_STATE="denied"; ADMISSION_REASON_CATEGORY="control-bind-cancelled" ;;
            skipped) ADMISSION_STATE="denied"; ADMISSION_REASON_CATEGORY="control-bind-skipped" ;;
            *) fail "control-bind result is not supplied by the workflow engine" ;;
          esac
          case "$CANDIDATE_JOB_RESULT" in success|failure|cancelled|skipped) ;; *) fail "candidate job result is not supplied by the workflow engine" ;; esac
          [ "$ADMISSION_STATE" != "denied" ] || [ "$CANDIDATE_JOB_RESULT" = "skipped" ] || fail "candidate job ran after a denied admission"
          umask 077
          RECEIPT_WRITER="$GITHUB_WORKSPACE/control/scripts/g1-candidate-control-plane/write-trusted-receipt.sh"
          [ -x "$RECEIPT_WRITER" ] || fail "external trusted receipt writer is missing or not executable"
          "$RECEIPT_WRITER" \
            --candidate-repository "$CANDIDATE_REPOSITORY" \
            --candidate-sha "$CANDIDATE_SHA" \
            --candidate-source-tree-sha256 "$CANDIDATE_SOURCE_TREE_SHA256" \
            --admission-state "$ADMISSION_STATE" \
            --admission-reason-category "$ADMISSION_REASON_CATEGORY" \
            --control-bind-result "$CONTROL_BIND_RESULT" \
            --candidate-job-result "$CANDIDATE_JOB_RESULT" \
            --control-repository "$CONTROL_REPOSITORY" \
            --control-sha "$CONTROL_SHA" \
            --candidate-runner-image "$CANDIDATE_RUNNER_IMAGE" \
            --control-harness-sha256 "$CONTROL_HARNESS_SHA256" \
            --authorization-register-reference "$CONTROL_AUTHORIZATION_REGISTER_REFERENCE" \
            --authorization-register-sha256 "$CONTROL_AUTHORIZATION_REGISTER_SHA256" \
            --authorization-evidence "$CONTROL_AUTHORIZATION_EVIDENCE" \
            --authorization-reference "$CONTROL_APPROVAL_REFERENCE" \
            --out "$RECEIPT_OUT"
          [ -f "$RECEIPT_OUT" ] && [ ! -L "$RECEIPT_OUT" ] || fail "trusted receipt writer did not create a regular receipt"
          chmod 600 "$RECEIPT_OUT"
      - name: Upload trusted control-plane receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-control-plane-receipt-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g1-control-plane-receipt.json
          if-no-files-found: error
          retention-days: 90
