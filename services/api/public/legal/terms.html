<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk&Talk 用户协议</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; max-width: 720px; margin: 0 auto; padding: 24px; color: #1a1a1a; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    p, li { color: #333; } .meta { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Talk&Talk 用户协议与安全规范</h1>
  <p class="meta">版本 0.1 · 适用于 App 与正式 API · 更新日期以仓库发布为准</p>

  <h2>服务边界</h2>
  <p>本平台仅提供线上文字与语音陪伴服务，不提供线下见面、私下交易或医疗诊断承诺。</p>

  <h2>沟通规范</h2>
  <p>禁止诱导添加私人联系方式、转账、线下邀约，以及骚扰、低俗、PUA 等越界表达。</p>

  <h2>广场氛围</h2>
  <p>广场内容需尊重他人，禁止广告引流、引战辱骂；越界内容会被拦截。</p>

  <h2>信用与处置</h2>
  <p>首次与再次轻度违规将收到协议提醒；累计违规将扣减安全分并限制发帖或沟通权限。</p>

  <h2>申诉与举报</h2>
  <p>如遇不适可立即结束沟通并举报；误报经核实后可恢复信用分。</p>
</body>
</html>
