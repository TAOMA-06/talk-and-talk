services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/talk-and-talk.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    env_file:
      - ${DEPLOY_ENV_FILE:-./services/api/.env.production}
    environment:
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talk_and_talk
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d talk_and_talk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Production hardening (manual): enable requirepass and set REDIS_URL=redis://:PASSWORD@redis:6379
  # WeChat pay private key: mount host secret to WECHAT_PAY_PRIVATE_KEY_PATH (e.g. /run/secrets/wechat_private_key.pem)
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: